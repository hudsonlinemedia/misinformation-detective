<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Misinformation Detective: Archaeology</title><style>:root{--green:#2c7a3a;--green-bg:#e9f6e6;--ink:#141414;--paper:#f4ecdc;--paper2:#ebe0c8;--manila:#e3c98f;--red:#c0202b;--red2:#9e1822;--blond:#e6cf96;--g1:#d9d2c3;--g2:#9a9a9a;--g3:#5a5a5a;--desk:#1e1c1a;
--type:"Courier Prime","Courier New",Courier,monospace;--head:Oswald,"Bebas Neue",Impact,"Arial Narrow Bold","Arial Narrow","Franklin Gothic Medium",sans-serif;--body:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--hand:"Segoe Print","Bradley Hand","Chalkboard SE","Marker Felt","Comic Sans MS",cursive}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:#151311}
body{margin:0;font-family:var(--body);color:var(--paper);line-height:1.5;min-height:100vh;
background:repeating-linear-gradient(-28deg,rgba(255,240,210,.035) 0 38px,transparent 38px 92px),radial-gradient(ellipse at 25% -10%,#433a30 0%,#26221e 45%,#151311 100%) fixed}
a{color:var(--red2)}
button{font:inherit;color:inherit;cursor:pointer}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--blond);outline-offset:3px}
/* header */
.top{position:sticky;top:0;z-index:30;background:rgba(17,16,15,.94);border-bottom:2px solid #000;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.top-in{max-width:1200px;margin:auto;display:flex;align-items:center;gap:12px;padding:9px 16px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:9px;background:none;border:0;padding:0;margin:0;color:var(--paper);text-align:left}
.logo svg{width:34px;height:34px;flex:none}
.logo b{display:block;font-family:var(--head);font-weight:700;font-size:1.15rem;letter-spacing:.06em;line-height:1}
.logo small{display:block;font-family:var(--type);font-size:.7rem;color:var(--blond);letter-spacing:.08em}
.top-nav{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap;align-items:center}
.tbtn{background:transparent;border:1.5px solid rgba(244,236,220,.35);color:var(--paper);padding:6px 11px;border-radius:6px;font-size:.85rem;font-weight:650;margin:0}
.tbtn:hover{border-color:var(--paper);background:rgba(255,255,255,.06)}
.tbtn[aria-pressed="true"]{border-color:var(--blond);color:var(--blond)}
.pts{font-family:var(--type);font-weight:700;background:var(--red);color:#fff;border:2px solid #000;padding:5px 11px;border-radius:6px;box-shadow:2px 2px 0 #000;white-space:nowrap}
.pts.bump{animation:bump .6s ease}
@keyframes bump{30%{transform:scale(1.18)}}
/* stage */
#stage{max-width:1200px;margin:0 auto;padding:22px 16px 60px;display:grid;grid-template-columns:270px minmax(0,1fr);gap:26px;align-items:start}
#view{min-width:0}
#view:focus{outline:none}
/* professor desk */
#desk{order:-1;position:sticky;top:78px;display:flex;flex-direction:column;align-items:center;gap:0}
.pf-figbtn{display:block;width:230px;padding:0;margin:0;border:0;background:none;filter:drop-shadow(5px 5px 0 rgba(0,0,0,.55))}
.pf-figbtn{position:relative}
.pf-figbtn>svg{display:block;width:100%;height:auto}
.pf-flash{position:absolute;inset:-16px;pointer-events:none;opacity:0}
.pf-flash.f1{background:radial-gradient(circle at 78% 14%,#fff 0%,rgba(255,255,255,.97) 22%,rgba(255,252,235,.5) 50%,rgba(255,255,255,0) 80%)}
.pf-flash.f2{background:radial-gradient(circle at 18% 24%,#fff 0%,rgba(255,255,255,.97) 22%,rgba(255,252,235,.5) 50%,rgba(255,255,255,0) 80%)}
.pf-flash.f3{background:radial-gradient(circle at 70% 80%,#fff 0%,rgba(255,255,255,.97) 24%,rgba(255,252,235,.55) 52%,rgba(255,255,255,0) 82%)}
.pf-flash svg{position:absolute;width:48%;opacity:0}
.pf-flash.f1 svg{right:0;top:-6%}.pf-flash.f2 svg{left:-4%;top:2%}.pf-flash.f3 svg{right:6%;bottom:6%}
.pf-caption{position:absolute;left:-18px;right:-18px;bottom:-14px;opacity:0;pointer-events:none;background:#f4ecdc;color:#111;border:2.5px solid #111;box-shadow:4px 4px 0 #000;padding:6px 8px 5px;text-align:center;font-family:var(--head);font-size:1.05rem;letter-spacing:.04em;line-height:1.05;transform:rotate(-3deg)}
.pf-caption small{display:block;font-family:var(--type);font-size:.62rem;letter-spacing:.16em;color:var(--red);margin-bottom:2px}
.pf-figbtn.flash{z-index:6;animation:photopop 2.9s cubic-bezier(.2,1.3,.4,1)}
.pf-figbtn.flash>svg{animation:flashexp 2.4s ease-out}
.pf-figbtn.flash .pf-flash.f1{animation:flashpop .55s ease-out}
.pf-figbtn.flash .pf-flash.f2{animation:flashpop .55s ease-out .32s}
.pf-figbtn.flash .pf-flash.f3{animation:flashpop .7s ease-out .62s}
.pf-figbtn.flash .pf-flash.f1 svg{animation:flashstar .55s ease-out}
.pf-figbtn.flash .pf-flash.f2 svg{animation:flashstar .55s ease-out .32s}
.pf-figbtn.flash .pf-flash.f3 svg{animation:flashstar .7s ease-out .62s}
.pf-figbtn.flash .pf-caption{animation:captionin 3.4s ease .55s}
@keyframes photopop{0%{transform:none}10%{transform:scale(1.18) rotate(-3deg);filter:drop-shadow(12px 14px 0 rgba(0,0,0,.65))}14%{transform:scale(1.13) rotate(-2.4deg)}20%{transform:scale(1.15) rotate(-2.6deg) translate(1px,-1px)}24%{transform:scale(1.13) rotate(-2.4deg)}75%{transform:scale(1.13) rotate(-2.4deg);filter:drop-shadow(12px 14px 0 rgba(0,0,0,.65))}100%{transform:none}}
@keyframes flashexp{0%{filter:brightness(3.6) contrast(.25) grayscale(1)}8%{filter:brightness(1.5) contrast(1) grayscale(1)}13%{filter:brightness(3.4) contrast(.3) grayscale(1)}20%{filter:brightness(1.5) contrast(1) grayscale(1)}26%{filter:brightness(3.8) contrast(.25) grayscale(1)}40%{filter:brightness(2) contrast(.7) grayscale(1)}70%{filter:brightness(1.15) contrast(1.15) grayscale(.5) sepia(.3)}100%{filter:none}}
@keyframes flashpop{0%{opacity:0}8%{opacity:1}40%{opacity:.35}100%{opacity:0}}
@keyframes flashstar{0%{opacity:0;transform:scale(.2) rotate(0)}12%{opacity:1;transform:scale(.9)}100%{opacity:0;transform:scale(1.7) rotate(30deg)}}
@keyframes captionin{0%{opacity:0;transform:translateY(22px) rotate(-8deg) scale(.6)}12%{opacity:1;transform:translateY(0) rotate(-2deg) scale(1.08)}18%{transform:rotate(-3deg) scale(1)}85%{opacity:1;transform:rotate(-3deg) scale(1)}100%{opacity:0;transform:translateY(8px) rotate(-3deg)}}
#screenFlash{position:fixed;inset:0;z-index:60;pointer-events:none;background:#fff;opacity:0}
#screenFlash.go{animation:screenflash .95s ease-out}
@keyframes screenflash{0%{opacity:0}4%{opacity:.6}16%{opacity:0}33%{opacity:.45}45%{opacity:0}66%{opacity:.35}80%{opacity:0}100%{opacity:0}}
.desk-bubble{position:relative;margin-top:24px;width:100%;color:#141414;border:3px solid #111;border-radius:20px;padding:24px 16px 15px;box-shadow:5px 5px 0 #000;transition:opacity .25s,transform .25s;
 background:linear-gradient(140deg,#fffdf4 58%,rgba(255,253,244,.0) 92%),radial-gradient(circle,#cdbf9f 1.15px,transparent 1.6px) 0 0/6px 6px,#fffdf4}
.desk-bubble::before{content:"";position:absolute;left:64%;top:-20px;border-width:0 11px 20px 11px;border-style:solid;border-color:transparent transparent #111 transparent}
.desk-bubble::after{content:"";position:absolute;left:calc(64% + 4px);top:-13px;border-width:0 7px 14px 7px;border-style:solid;border-color:transparent transparent #fffdf4 transparent}
.desk-bubble.fresh{opacity:0;transform:translateY(6px)}
.pf-name{position:absolute;top:-15px;left:12px;display:inline-block;font-family:var(--head);font-weight:700;font-size:.78rem;letter-spacing:.2em;color:#f4ecdc;background:#111;padding:4px 11px 3px;border:2px solid #111;transform:rotate(-2.5deg);box-shadow:3px 3px 0 var(--red)}
#pfText{margin:0;font-family:var(--type);font-weight:700;font-size:.95rem;line-height:1.45;color:#2a2620;min-height:2.9em}
#pfText .lead{display:block;font-family:var(--head);font-weight:700;font-size:1.22rem;line-height:1.08;letter-spacing:.035em;text-transform:uppercase;color:#111;margin-bottom:6px}
#pfText .lead::before{content:"";display:inline-block;width:8px;height:8px;background:var(--red);transform:rotate(45deg);margin:0 8px 3px 1px}
#pfText .rest.typing::after{content:"";display:inline-block;width:.5em;height:1em;background:#111;vertical-align:-.12em;margin-left:2px;animation:blink .7s steps(1) infinite}
/* generic paper */
.sheet{background:var(--paper);color:var(--ink);border:2px solid #000;border-radius:4px;box-shadow:0 14px 34px rgba(0,0,0,.5);padding:22px 24px;position:relative}
.sheet+.sheet{margin-top:22px}
.sheet h2,.sheet h3{font-family:var(--head);letter-spacing:.03em;margin:.2em 0 .4em;line-height:1.15}
.sheet h2{font-size:1.65rem}.sheet h3{font-size:1.2rem}
.kicker{display:inline-block;font-family:var(--type);font-weight:700;font-size:.74rem;letter-spacing:.14em;background:#111;color:var(--paper);padding:3px 8px;margin-bottom:6px}
.muted{color:#4d4639}
.btn{display:inline-flex;align-items:center;gap:7px;margin:0;font-weight:800;font-size:.95rem;padding:10px 16px;border:2px solid #000;border-radius:6px;background:var(--paper);color:#111;box-shadow:3px 3px 0 #000;transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 #000}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
.btn.red{background:var(--red);color:#fff}
.btn.dark{background:#111;color:var(--paper);border-color:#000}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:3px 3px 0 #000}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* board */
.hero{display:grid;grid-template-columns:1fr;gap:6px;background:transparent;padding:4px 0 10px}
.hero h1{font-family:var(--head);font-size:clamp(2.1rem,5.2vw,3.6rem);line-height:.95;margin:6px 0;letter-spacing:.03em;color:var(--paper);text-shadow:3px 3px 0 #000}
.hero h1 span{color:var(--red);text-shadow:3px 3px 0 #000}
.hero .sub{font-family:var(--type);color:var(--blond);font-weight:700;letter-spacing:.04em;margin:0}
.brief{margin-top:14px}
.brief .tw{font-family:var(--type);font-size:1.02rem;min-height:3em}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:14px 0 4px;padding:0;list-style:none}
.rules li{border:1.5px dashed #6d6355;padding:9px 11px;font-size:.9rem;background:rgba(255,255,255,.35)}
.rules b{font-family:var(--head);letter-spacing:.04em;display:block;font-size:1rem}
.group-h{font-family:var(--head);color:var(--paper);letter-spacing:.12em;font-size:1.05rem;margin:30px 0 14px;display:flex;align-items:center;gap:10px}
.group-h::after{content:"";flex:1;height:2px;background:repeating-linear-gradient(90deg,rgba(244,236,220,.4) 0 8px,transparent 8px 14px)}
.folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:34px 22px}
.folder{position:relative;text-align:left;margin:0;margin-top:20px;padding:14px 14px 13px;background:var(--manila);color:#111;border:2px solid #000;border-radius:0 9px 9px 9px;box-shadow:5px 5px 0 #000;transition:transform .15s,box-shadow .15s;display:flex;flex-direction:column;gap:6px;min-height:100%}
.folder::before{content:attr(data-tab);position:absolute;top:-24px;left:-2px;height:24px;padding:3px 14px 0;background:var(--manila);border:2px solid #000;border-bottom:0;border-radius:8px 8px 0 0;font-family:var(--type);font-weight:700;font-size:.72rem;letter-spacing:.1em}
.folder:hover{transform:translateY(-4px) rotate(-.6deg);box-shadow:7px 9px 0 #000}
.folder .thumb{background:var(--paper);border:1.5px solid #000;height:112px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.folder .thumb svg{width:100%;height:100%}
.folder h3{font-family:var(--head);font-size:1.15rem;margin:2px 0 0;letter-spacing:.03em;line-height:1.15}
.folder .meta{font-family:var(--type);font-size:.74rem;font-weight:700;color:#3e3628}
.folder .desc{font-size:.85rem;color:#2c261c;margin:0}
.bar{height:8px;border:1.5px solid #000;background:var(--paper);margin-top:auto}
.bar i{display:block;height:100%;background:var(--red)}
.folder .score{font-family:var(--type);font-size:.78rem;font-weight:700;display:flex;justify-content:space-between}
.fstamp{position:absolute;right:10px;top:62px;transform:rotate(-14deg);font-family:var(--head);font-size:1.25rem;letter-spacing:.08em;color:var(--red);border:3px solid var(--red);padding:1px 8px;background:rgba(244,236,220,.82);mix-blend-mode:multiply}
.fstamp.new{color:#111;border-color:#111}
.record{margin-top:34px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px;margin:12px 0}
.tile{border:1.5px solid #000;background:#fff9ea;padding:8px 10px}
.tile small{display:block;font-size:.76rem;color:#4d4639;line-height:1.2}
.tile strong{font-family:var(--type);font-size:1.2rem}
/* investigation */
.invbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.back{margin:0;background:none;border:1.5px solid rgba(244,236,220,.4);color:var(--paper);padding:6px 11px;border-radius:6px;font-weight:700;font-size:.85rem}
.back:hover{border-color:var(--paper)}
.casename{font-family:var(--type);font-weight:700;color:var(--blond);letter-spacing:.05em;font-size:.88rem}
.pips{display:flex;gap:5px;margin-left:auto;flex-wrap:wrap}
.pip{width:22px;height:22px;border-radius:50%;border:2px solid var(--paper);background:transparent;font-family:var(--type);font-size:.68rem;font-weight:700;color:var(--paper);display:flex;align-items:center;justify-content:center;padding:0;margin:0}
.pip.cur{background:var(--paper);color:#111}
.pip.ok{background:var(--green);border-color:var(--green);color:#fff}
.pip.no{background:#5a5a5a;border-color:#5a5a5a;color:#fff}
.exrow{display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr);gap:20px;align-items:start}
.photo{position:relative;background:#fbf6ea;border:2px solid #000;padding:8px 8px 26px;box-shadow:4px 5px 0 rgba(0,0,0,.35);transform:rotate(-1.6deg);margin-top:6px}
.photo svg.exsvg{display:block;width:100%;height:auto;background:var(--paper);border:1px solid #000}
.photo .exlabel{position:absolute;left:10px;bottom:5px;font-family:var(--type);font-weight:700;font-size:.72rem;letter-spacing:.1em}
.clip{position:absolute;top:-14px;left:28px;width:16px;height:40px;border:3px solid #6f6f6f;border-radius:9px;transform:rotate(8deg);border-bottom-color:transparent}
.vstamp{position:absolute;z-index:3;left:50%;top:44%;transform:translate(-50%,-50%) rotate(-10deg);font-family:var(--head);font-weight:700;font-size:1.9rem;line-height:1.1;letter-spacing:.06em;white-space:nowrap;padding:5px 14px 4px;border:5px double currentColor;border-radius:4px;color:var(--red);background:#fffbf0;box-shadow:0 0 0 3px #fffbf0,4px 5px 0 rgba(0,0,0,.35);opacity:0;pointer-events:none}
.vstamp.on{opacity:1;animation:stampin .42s cubic-bezier(.2,1.6,.4,1)}
.vstamp.ink{color:var(--red)}
.photo svg.exsvg,.photo .poster{transition:filter .35s,opacity .35s}
.photo.stamped svg.exsvg,.photo.stamped .poster{animation:none!important;filter:grayscale(1) contrast(.85);opacity:.4}
.vstamp.good{color:var(--green)}
@keyframes stampin{0%{transform:translate(-50%,-50%) rotate(-22deg) scale(2.6);opacity:0}100%{transform:translate(-50%,-50%) rotate(-10deg) scale(1);opacity:1}}
.transcript{background:#fffdf7;border:1.5px solid #000;padding:12px 14px 14px;position:relative;background-image:repeating-linear-gradient(transparent 0 27px,rgba(80,120,170,.18) 27px 28px);background-position:0 9px}
.ttag{font-family:var(--type);font-size:.72rem;font-weight:700;letter-spacing:.12em;color:var(--red);margin:0 0 5px}
.tw{font-family:var(--type);white-space:pre-wrap;margin:0}
.transcript .tw{font-size:1.02rem;line-height:28px;min-height:56px}
.typing::after{content:"";display:inline-block;width:.55em;height:1.05em;background:#111;vertical-align:-.15em;margin-left:2px;animation:blink .7s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.dossier{margin:16px 0 0;border:2px solid #000;background:#f7f0dc;padding:12px 14px;font-size:.92rem}
.dossier h4{font-family:var(--head);letter-spacing:.06em;margin:0 0 6px;font-size:1rem}
.dossier dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.dossier dt{font-family:var(--type);font-weight:700;font-size:.78rem;padding-top:2px}
.dossier dd{margin:0}
.exright{min-width:0}
.exright .qbox{margin:18px 0 0}
.qbox{margin:20px 0 10px;border-left:6px solid var(--red);padding:4px 0 4px 14px}
.qlabel{font-family:var(--head);letter-spacing:.14em;font-size:.82rem;color:var(--red)}
.qbox .tw{font-size:1.2rem;font-weight:700;line-height:1.4;min-height:1.4em}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-top:12px}
.icard{position:relative;display:flex;gap:11px;align-items:flex-start;text-align:left;margin:0;padding:13px 14px 13px 12px;border:2px solid #000;border-radius:3px;color:#111;background:#fffef8;background-image:linear-gradient(90deg,transparent 46px,rgba(192,32,43,.35) 46px 47.5px,transparent 47.5px),repeating-linear-gradient(transparent 0 23px,rgba(80,120,170,.17) 23px 24px);box-shadow:3px 3px 0 #000;font-size:.98rem;line-height:1.38;transition:transform .14s,box-shadow .14s;opacity:0;transform:translateY(10px)}
.cards.show .icard{animation:cardin .35s ease forwards}
.cards.show .icard:nth-child(2){animation-delay:.08s}.cards.show .icard:nth-child(3){animation-delay:.16s}.cards.show .icard:nth-child(4){animation-delay:.24s}
@keyframes cardin{to{opacity:1;transform:none}}
.cards.done .icard,.cards.instant .icard{opacity:1;transform:none;animation:none}
.icard:not(:disabled):hover{transform:translate(-2px,-3px) rotate(-.4deg);box-shadow:5px 6px 0 #000}
.icard .lt{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid #000;font-family:var(--type);font-weight:700;display:flex;align-items:center;justify-content:center;background:var(--paper)}
.icard:disabled{cursor:default}
.icard.right{background-color:var(--green-bg);border-color:var(--green);outline:3px solid var(--green);outline-offset:2px;box-shadow:3px 3px 0 var(--green)}
.icard.right .lt{background:var(--green);color:#fff;border-color:var(--green)}
.icard.wrong{color:#6a6258}
.icard.wrong .txt{text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:2px}
.icard.wrong .lt{background:#5a5a5a;color:#fff}
.icard.dim{opacity:.6!important}
.navrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px}
.navrow .sp{flex:1}
.skip{margin:0;background:none;border:1.5px dashed #6d6355;color:#3e3628;padding:6px 11px;border-radius:5px;font-family:var(--type);font-weight:700;font-size:.8rem}
.notes{margin-top:18px;border:2px solid #000;background:#fdf6cf;background-image:linear-gradient(90deg,transparent 30px,rgba(192,32,43,.4) 30px 31.5px,transparent 31.5px),repeating-linear-gradient(transparent 0 25px,rgba(80,120,170,.2) 25px 26px);padding:12px 16px 14px 42px;box-shadow:4px 4px 0 rgba(0,0,0,.35);animation:notesin .45s ease both;color:#1b1710}
@keyframes notesin{from{opacity:0;transform:translateY(12px) rotate(.8deg)}to{opacity:1;transform:none}}
.notes h4{font-family:var(--hand);color:var(--red2);font-size:1.15rem;margin:0 0 4px;font-weight:700}
.notes p{margin:.3em 0 .55em}
.notes .lens{font-style:italic}
.notes details{margin-top:6px}
.notes summary{cursor:pointer;font-weight:800}
.notes ul{margin:.3em 0;padding-left:1.2em}
.plus{position:absolute;font-family:var(--head);font-size:1.6rem;color:#3fae52;text-shadow:2px 2px 0 #000;pointer-events:none;animation:plus 1.2s ease forwards;z-index:5}
@keyframes plus{0%{opacity:0;transform:translateY(10px) scale(.7)}20%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-40px)}}
/* ad poster */
.poster{border:2px solid #000;padding:14px 12px 12px;text-align:center;position:relative;min-height:100%;display:flex;flex-direction:column;gap:6px;justify-content:center;background:#f6efe0;color:#111}
.poster .brand{font-family:var(--type);font-weight:700;font-size:.72rem;letter-spacing:.16em}
.poster .head{font-family:var(--head);font-size:1.55rem;line-height:1.02;letter-spacing:.02em}
.poster .art{height:92px}.poster .art svg{height:100%;width:auto}
.poster .pitch{font-size:.88rem;font-weight:650;margin:0}
.poster .fine{font-size:.68rem;color:#4d4639;margin:0}
.poster.vintage{background:#efe1bf;border-style:double;border-width:6px}

<script>const DATA={"cases": [{"id": "dig", "icon": "⛏️", "title": "The Excavation", "time": "8–10 min", "topic": "Excavate a site without losing its story", "intro": "A field crew has opened a trench. Every layer, find and stain in the soil is a clue, but only if it is recorded before it is removed. Learn how archaeologists keep a site's story intact.", "group": "cases", "art": "trowel", "win": "evidence", "prof": "The trench is open. Before anything leaves the ground, we write down where it was.", "key": "Context, the relationships among finds, layers and features, is the evidence. Once it is dug, only the record remains.", "tab": "CASE 01", "final": false, "questions": [{"post": "FIELD NOTE · TRENCH 2|A stone blade, charcoal and pottery lie together in an undisturbed hearth.", "q": "What is most important to record before removing them?", "opts": ["Only the most valuable artifact", "Only the depth of the blade", "Their exact positions, layer, associations and photographs"], "correct": 2, "why": "Context, the relationships among finds, sediments and features, is essential to interpretation.", "think": "Why might a plain piece of charcoal tell you more than a beautiful blade?", "art": "trowel"}, {"post": "FIELD NOTE · FLOTATION SAMPLE|A charred seed is recovered from an ancient cooking fire.", "q": "How is the seed best classified?", "opts": ["A modern artifact", "A feature", "An ecofact"], "correct": 2, "why": "Ecofacts are biological remains such as seeds, bones and pollen that inform us about past environments and behavior.", "think": "What could a single seed reveal about diet, season or environment?", "art": "seed"}, {"post": "FIELD NOTE · UNIT 4|A hearth is built into the ground: a ring of fire-cracked stones around a dark, ashy stain.", "q": "What kind of evidence is the hearth?", "opts": ["A portable artifact", "A feature", "A written source"], "correct": 1, "why": "Features are nonportable traces of human activity, such as hearths, pits and walls.", "think": "Why can a feature never go into a museum drawer the way an artifact can?", "art": "hearth"}, {"post": "SECTION DRAWING · NORTH WALL|A later pit cuts down through three older layers.", "q": "Which interpretation is safest?", "opts": ["Depth always gives an exact calendar date", "Everything in the pit is older than the bottom layer", "The pit disturbed the earlier sequence"], "correct": 2, "why": "Intrusive pits can mix or move materials, so archaeologists document cuts and disturbances.", "think": "How could a modern object end up deep in the ground next to ancient ones?", "art": "strata"}, {"post": "FIELD SCHOOL QUESTION|A student says: \"Archaeologists are careful. Digging doesn't destroy anything.\"", "q": "Why is excavation sometimes called destructive?", "opts": ["It always destroys artifacts", "Excavation permanently changes the original context", "Archaeologists do not make records"], "correct": 1, "why": "Even careful digging removes deposits; detailed recording preserves evidence of their original relationships.", "think": "Why might archaeologists choose to leave part of a site unexcavated for the future?", "art": "dossier"}]}, {"id": "dating", "icon": "🕰️", "title": "The Dating Lab", "time": "10–12 min", "topic": "Build a defensible chronology", "intro": "Samples have arrived from the field. Your job is to put events in order and attach dates, choosing the right method for each material and admitting what remains uncertain.", "group": "cases", "art": "treering", "win": "evidence", "prof": "Every method has its materials and its limits. Match them carefully.", "key": "Match the dating method to the material, then test the result against stratigraphy and independent evidence.", "tab": "CASE 02", "final": false, "questions": [{"post": "SECTION DRAWING|An undisturbed layer A lies directly below layer B.", "q": "Which layer is generally older?", "opts": ["B", "A", "They must be the same age"], "correct": 1, "why": "The law of superposition generally places older deposits beneath younger ones in undisturbed sequences.", "think": "What kinds of events could turn this rule upside down?", "art": "strata"}, {"post": "SAMPLE BAG 07|Charcoal is recovered from a secure, sealed ancient hearth.", "q": "Which technique is most appropriate?", "opts": ["Dendrochronology without wood", "Radiocarbon dating", "Potassium–argon dating of the charcoal"], "correct": 1, "why": "Radiocarbon can date once-living material such as charcoal, within its effective age range.", "think": "Why does it matter that the hearth was sealed?", "art": "radiocarbon"}, {"post": "SAMPLE BAG 12|Preserved wooden beams show measurable annual rings, and a suitable reference chronology exists.", "q": "Which method should you choose?", "opts": ["Dendrochronology", "Potassium–argon dating", "Only stylistic comparison"], "correct": 0, "why": "Tree-ring matching can provide precise calendar dates where reference chronologies exist.", "think": "Does the date the tree was cut always equal the date the building was used?", "art": "treering"}, {"post": "FIELD REPORT|A volcanic ash layer is associated with a very ancient site.", "q": "Which method might help date it?", "opts": ["Radiocarbon on the ash minerals", "Counting pottery decorations", "Potassium–argon or related argon dating"], "correct": 2, "why": "Argon-based techniques can date appropriate volcanic materials, often far beyond radiocarbon's range.", "think": "Why would dating the ash above and below a find be useful?", "art": "volcano"}, {"post": "POTTERY TRAY|Pottery shapes and decorations change gradually through time.", "q": "What is ordering styles into a relative sequence called?", "opts": ["DNA sequencing", "Repatriation", "Seriation"], "correct": 2, "why": "Seriation organizes artifacts into relative chronological sequences based on changing styles or frequencies.", "think": "What does a relative sequence tell you, and what can't it tell you?", "art": "potsherd"}, {"post": "LAB MEMO|Two dating methods applied to the same site give dates that disagree.", "q": "What should the team do?", "opts": ["Average the dates without checking", "Investigate context, assumptions, contamination and uncertainty", "Select whichever date supports the preferred story"], "correct": 1, "why": "Archaeologists assess provenance, samples, error ranges and independent lines of evidence.", "think": "Why is \"we're not sure yet\" sometimes the most honest result?", "art": "scale"}]}, {"id": "myst", "icon": "🗿", "title": "Ancient Mysteries", "time": "8–10 min", "topic": "Separate legends from testable claims", "intro": "Stonehenge and the Nazca Lines attract wizards, Druids and aliens. Legends can matter to people, but claims about who built something, and when, have to meet the evidence.", "group": "cases", "art": "stonehenge", "win": "debunk", "prof": "Big monuments draw big stories. Let's ask which stories can be tested.", "key": "A legend can be culturally meaningful and still not be evidence about who built a monument, or when.", "tab": "CASE 03", "final": false, "questions": [{"post": "SIMULATED VIDEO|\"Merlin the wizard built Stonehenge. The legend is centuries old, so it must hold some truth!\"", "q": "What is the strongest archaeological response?", "opts": ["Evaluate construction dates, materials and evidence for human building", "Dismiss every oral tradition without examination", "Accept it because the story is old"], "correct": 0, "why": "Legends can be culturally important, but claims about construction require archaeological evidence.", "think": "How can you respect a legend while still testing a claim?", "art": "stonehenge"}, {"post": "SIMULATED POST|\"Everyone knows the Druids built Stonehenge for their rituals.\"", "q": "What is the key chronological problem?", "opts": ["No one lived in prehistoric Britain", "The stones are made of wood", "Much of Stonehenge predates the historically documented Druids"], "correct": 2, "why": "Major phases of Stonehenge construction predate written references to Druids by many centuries.", "think": "Why do later groups often get credit for older monuments?", "art": "calendar"}, {"post": "LAB REPORT|Geologists compare the chemistry and mineralogy of Stonehenge stones with rock outcrops across Britain.", "q": "What can geological sourcing help establish?", "opts": ["Where the stone materials originated", "That supernatural forces moved the stones", "The builders' exact spoken words"], "correct": 0, "why": "Matching stone geochemistry and geology can reveal source regions and help investigate transport.", "think": "Once you know where a stone came from, what new questions open up?", "art": "map"}, {"post": "SIMULATED HEADLINE|\"The Nazca Lines must be alien landing strips. They're far too big to be anything else!\"", "q": "What is missing from this argument?", "opts": ["An imaginative narrative", "Evidence linking the markings to extraterrestrial activity", "A dramatic aerial photograph"], "correct": 1, "why": "Scale alone does not establish a cause. Archaeologists examine construction, dating, landscape and cultural context.", "think": "Why does size so often get treated as proof?", "art": "ufo"}, {"post": "RESEARCH SUMMARY|A researcher proposes that some Nazca geoglyphs had ceremonial significance.", "q": "What would strengthen the claim?", "opts": ["Associated pathways, offerings, chronology and landscape evidence", "The claim being difficult to disprove", "Only a viral video"], "correct": 0, "why": "Multiple contextual observations can support interpretations while leaving room for uncertainty.", "think": "How is this claim different in kind from the alien claim?", "art": "nazca"}]}, {"id": "rapa", "icon": "🌋", "title": "Rapa Nui Case Files", "time": "8–10 min", "topic": "Reassess a familiar collapse narrative", "intro": "A famous story says Rapa Nui (Easter Island) destroyed itself through warfare and ecocide. New studies challenge parts of that story. Weigh tools, bones and history before you decide.", "group": "cases", "art": "moai", "win": "debunk", "prof": "A famous story isn't the same as a well-supported one. Let's re-open this file.", "key": "Replace a single dramatic story with careful comparison of evidence, and don't leave colonial contact out of the explanation.", "tab": "CASE 04", "final": false, "questions": [{"post": "SIMULATED DOCUMENTARY|\"Every obsidian mata'a on Rapa Nui was a battlefield weapon.\"", "q": "What should you ask?", "opts": ["Do shape, wear patterns, context and injury evidence support that use?", "Does the narrator sound confident?", "Are the tools sharp in photographs?"], "correct": 0, "why": "Form alone does not prove function; archaeologists compare use-wear, contexts, experiments and skeletal evidence.", "think": "What everyday jobs could a sharp obsidian tool do?", "art": "obsidian"}, {"post": "LAB REPORT|Researchers find relatively little evidence for widespread lethal trauma in a particular skeletal sample.", "q": "What follows from this result?", "opts": ["The sample challenges sweeping warfare claims but cannot prove violence never occurred", "No conflict ever happened anywhere", "All historical accounts must be false"], "correct": 0, "why": "Absence or rarity in sampled evidence narrows claims; it does not justify absolute conclusions.", "think": "How big and how representative would a sample need to be?", "art": "skull"}, {"post": "CASE QUESTION|Rapa Nui's population fell dramatically after the 1700s.", "q": "Which factor is essential when evaluating these losses?", "opts": ["European contact, introduced diseases and enslavement", "Only deforestation", "Only a single legendary battle"], "correct": 0, "why": "Colonial contact and slave raids were catastrophic and cannot be omitted from explanations of demographic change.", "think": "Why might a \"they did it to themselves\" story be appealing to outsiders?", "art": "ship"}, {"post": "SIMULATED HEADLINE|\"New study DESTROYS the old ecocide theory! Everything you learned was a lie!\"", "q": "What is the best scientific response?", "opts": ["Compare datasets and competing hypotheses rather than replacing one certainty with another", "Declare every prior study fraudulent", "Assume one explanation must account for every change"], "correct": 0, "why": "Rapa Nui scholarship includes active debate about ecology, resilience, conflict and colonial disruption.", "think": "What would it look like for both studies to be partly right?", "art": "chart"}, {"post": "EXHIBIT|A moai stands on its stone platform, carved by Rapa Nui people centuries ago.", "q": "What is a moai evidence of?", "opts": ["Complex social and technical achievements, whose interpretation requires context", "Extraterrestrial construction", "A single universally accepted political system"], "correct": 0, "why": "Moai are monumental achievements; their production and meanings are studied using archaeological and Indigenous knowledge.", "think": "Whose knowledge should shape how moai are explained?", "art": "moai"}]}, {"id": "maya", "icon": "🧩", "title": "Mayapán Evidence Board", "time": "8–10 min", "topic": "Investigate an urban transformation", "intro": "Mayapán was a major Maya city that went through drought, political conflict and change. Pin each clue to the evidence board and decide what it can, and can't, tell you.", "group": "cases", "art": "temple", "win": "evidence", "prof": "Different clues, different strengths. Let's pin them up one at a time.", "key": "Independent lines of evidence (climate, bones, dates and history) are strongest when compared, not when one replaces the rest.", "tab": "CASE 05", "final": false, "questions": [{"post": "OSTEOLOGY REPORT|Skeletal remains from the city show signs of trauma.", "q": "What can this directly suggest?", "opts": ["Some individuals experienced injury, potentially including violence", "A drought certainly caused every death", "The entire city disappeared overnight"], "correct": 0, "why": "Trauma offers evidence about injuries; identifying causes and scale requires additional context.", "think": "What else would you need to know before speaking of a massacre or a war?", "art": "skull"}, {"post": "CAVE SAMPLE|A stalagmite record indicates a period of reduced rainfall.", "q": "What kind of evidence is this, primarily?", "opts": ["A paleoclimate proxy", "A direct eyewitness account", "A precise count of migration events"], "correct": 0, "why": "Cave deposits can preserve chemical signals interpreted as past climate patterns.", "think": "How does a climate record connect to people's daily lives?", "art": "stalagmite"}, {"post": "LAB MEMO|Radiocarbon dates from several secure contexts cluster in a period of political instability.", "q": "What do these dates contribute?", "opts": ["Proof of a single cause", "A complete written history", "Chronological constraints that can be compared with other evidence"], "correct": 2, "why": "Chronometric dates help align events and assess hypotheses, with uncertainties.", "think": "Why do error ranges matter when lining up events?", "art": "radiocarbon"}, {"post": "EVIDENCE BOARD|The team pins up drought records, trauma data, excavation results and historical accounts side by side.", "q": "Why compare all of these?", "opts": ["Every source automatically agrees", "One source can replace all the others", "Independent evidence can test a multicausal explanation"], "correct": 2, "why": "Different sources illuminate climate, conflict, political change and mobility from distinct angles.", "think": "What would you do if two sources disagreed?", "art": "dossier"}, {"post": "CASE QUESTION|Students are asked to summarize current thinking about Mayapán.", "q": "Which conclusion best reflects current archaeological reasoning?", "opts": ["One drought instantly ended Maya civilization", "Political conflict and environmental stress may have interacted; the evidence requires careful interpretation", "The Maya people vanished"], "correct": 1, "why": "Mayapán's political transformations did not mean Maya peoples disappeared. Interpretations consider interacting factors and continuing communities.", "think": "Millions of Maya people live today. Why does \"collapse\" language need care?", "art": "temple"}]}, {"id": "pseudo", "icon": "🔎", "title": "Pseudoarchaeology Detectives", "time": "10–12 min", "topic": "Test extraordinary stories with ordinary standards", "intro": "Ancient aliens, lost super-civilizations, secret knowledge. These stories rely on reasoning tricks. Learn to name the trick and hold every claim to the same standard of evidence.", "group": "special", "art": "ufo", "win": "debunk", "prof": "Extraordinary stories still have to pass ordinary tests. Name the trick.", "key": "A gap in our knowledge is an invitation to investigate, not proof of aliens, Atlantis or anything else.", "tab": "SPECIAL FILE", "final": false, "questions": [{"post": "SIMULATED VIDEO|\"Archaeologists cannot explain this monument, therefore aliens built it.\"", "q": "What kind of reasoning is this?", "opts": ["A radiocarbon result", "A stratigraphic observation", "An argument from ignorance"], "correct": 2, "why": "A gap in current explanation does not establish a particular alternative.", "think": "Why does \"nobody knows\" often get used as \"I know\"?", "art": "ufo"}, {"post": "SIMULATED COMMENT|\"The expert is wrong because she works at a university.\"", "q": "What does this comment attack?", "opts": ["The chemical composition of stone", "The person rather than the evidence", "The date of the artifact"], "correct": 1, "why": "Ad hominem arguments substitute attacks on people for assessment of evidence.", "think": "What would a real criticism of her evidence look like?", "art": "insult"}, {"post": "SIMULATED VIDEO|A video shows only three spectacular artifacts while ignoring hundreds of ordinary finds from the same site.", "q": "What should you watch for?", "opts": ["Repatriation", "Cherry-picking", "Dendrochronology"], "correct": 1, "why": "Selective evidence can create a misleading impression of the whole record.", "think": "What would the full collection of finds tell you?", "art": "cherries"}, {"post": "DISCUSSION FILE|Ancient-aliens shows often focus on monuments built by non-European peoples.", "q": "Why can these claims reinforce racist or colonial ideas?", "opts": ["They establish cultural equality through excavation", "They always quote Indigenous scholars accurately", "They may deny Indigenous peoples credit for sophisticated achievements"], "correct": 2, "why": "Some pseudoarchaeological narratives portray non-European achievements as impossible without outsiders.", "think": "Whose ancestors get \"help\" in these stories, and whose never do?", "art": "warning"}, {"post": "METHODS FILE|Two hypotheses compete to explain the same site.", "q": "What makes a hypothesis archaeologically useful?", "opts": ["It depends entirely on mystery", "It makes testable predictions and can be revised by evidence", "It cannot be questioned"], "correct": 1, "why": "Scientific explanations must be open to testing, comparison and revision.", "think": "What finding would prove your favorite idea wrong?", "art": "chart"}, {"post": "METHODS FILE|A classmate invokes Occam's razor.", "q": "What does Occam's razor suggest?", "opts": ["Ignore complex historical processes", "Prefer explanations requiring fewer unsupported assumptions, when the evidence fits", "Always choose the simplest story regardless of evidence"], "correct": 1, "why": "Parsimony is a guide, not a substitute for data; the best explanation must account for the evidence.", "think": "When could the simplest story actually be wrong?", "art": "brain"}]}, {"id": "ethics", "icon": "🤝", "title": "Who Owns the Past?", "time": "8–10 min", "topic": "Practice archaeological ethics", "intro": "Archaeology is about living people as well as the past. Decide how to care for ancestral remains, sites threatened by construction, oral histories and sensitive information.", "group": "special", "art": "box", "win": "evidence", "prof": "The past belongs to people who are still here. Let's act like it.", "key": "Ethical archaeology means consultation, protection and respect for the descendant communities whose past it is.", "tab": "ETHICS FILE", "final": false, "questions": [{"post": "MUSEUM FILE|A museum holds ancestral remains from a Native American community.", "q": "What should happen first?", "opts": ["Display them without consultation", "Sell them to private collectors", "Follow applicable law and consult affiliated communities about care and repatriation"], "correct": 2, "why": "NAGPRA and ethical practice emphasize consultation and repatriation where applicable.", "think": "Why might a community want ancestors returned rather than studied?", "art": "box"}, {"post": "CONSTRUCTION SITE|A construction project uncovers an archaeological site.", "q": "What is cultural resource management (CRM) concerned with?", "opts": ["Maximizing souvenir sales", "Avoiding documentation", "Identifying, evaluating and managing impacts on cultural heritage"], "correct": 2, "why": "CRM addresses heritage affected by development and legal compliance.", "think": "Who should have a say when a road is planned through a site?", "art": "bulldozer"}, {"post": "RESEARCH PLAN|A team designs a project on land with deep Indigenous history.", "q": "Why include Indigenous oral histories in the research?", "opts": ["They are always irrelevant", "They automatically give exact radiocarbon dates", "They can provide important knowledge and perspectives to evaluate respectfully alongside other evidence"], "correct": 2, "why": "Indigenous knowledge and oral histories can be vital evidence and guide ethical interpretation.", "think": "What can oral history capture that excavation can't?", "art": "oral"}, {"post": "SIMULATED TEXTBOOK|\"The Taíno and Kalinago peoples vanished entirely after European arrival.\"", "q": "What is a key concern with this interpretation?", "opts": ["It erases living descendants and ongoing Indigenous identities", "It is proven by the existence of colonial texts", "It makes archaeological evidence unnecessary"], "correct": 0, "why": "Colonial disappearance narratives often obscure survival, continuity and present-day communities.", "think": "Who wrote the colonial records, and who was left out?", "art": "newspaper"}, {"post": "PUBLICATION DRAFT|Researchers plan to publish exact coordinates for a vulnerable site online.", "q": "What should they consider?", "opts": ["Only how many clicks the map will get", "Community preferences, site protection and potential looting risks", "Whether the site is photogenic"], "correct": 1, "why": "Ethical stewardship includes protecting vulnerable sites and respecting community concerns.", "think": "When is withholding information the responsible choice?", "art": "mappin"}]}, {"id": "board", "icon": "🏛️", "title": "The Archaeological Review Board", "time": "10 min", "topic": "Solve a new case using all your skills", "intro": "The review board has a new case and wants your report. Use everything you've learned: context, dating, testing claims and ethics.", "group": "final", "art": "dossier", "win": "evidence", "prof": "The final case. Use everything you've learned.", "key": "A strong report separates observation from interpretation, states uncertainty and considers the people involved.", "tab": "FINAL FILE", "final": true, "questions": [{"post": "🚨 FINAL CASE · CONSTRUCTION FILL|A carved stone is found in fill dumped by a modern construction crew.", "q": "Can its original date be inferred from the depth of the fill?", "opts": ["Yes; the deepest fill is always oldest", "No; its original context is unknown", "Yes; the carving always dates to the fill"], "correct": 1, "why": "Secondary context can relocate objects; the findspot does not necessarily date manufacture or first use.", "think": "What could still be learned from an object that has lost its context?", "art": "strata"}, {"post": "🕵️ FINAL CASE · SAMPLES|A charred seed lies sealed under a floor; a volcanic layer lies far below.", "q": "Which dating plan is strongest?", "opts": ["Radiocarbon-date the seed and independently assess the volcanic context", "Use only the depth of the seed", "Assume both deposits formed in the same year"], "correct": 0, "why": "Match methods to materials and compare independent contextual evidence.", "think": "How do the two dates bracket the floor?", "art": "seed"}, {"post": "🚨 FINAL CASE · SIMULATED HEADLINE|\"This Indigenous city was too advanced to have been built by the people who lived there.\"", "q": "What is your first concern?", "opts": ["The lack of an alien photograph", "The unsupported premise and potential colonial bias", "The city's modern tourist appeal"], "correct": 1, "why": "Question assumptions that deny local peoples technological and social agency.", "think": "Who decides what counts as \"too advanced\"?", "art": "newspaper"}, {"post": "🕵️ FINAL CASE · EVIDENCE BOARD|Climate evidence and signs of conflict overlap in time.", "q": "Which claim is best?", "opts": ["They may have interacted, but overlap alone does not establish causation", "Climate definitely caused every conflict", "Neither source has value"], "correct": 0, "why": "Correlation helps formulate hypotheses but cannot alone prove causation.", "think": "What evidence would link the two more directly?", "art": "chart"}, {"post": "🏛️ FINAL CASE · YOUR REPORT|The review board asks for your written report on the site.", "q": "What should your final report do?", "opts": ["State only the most exciting theory", "Hide evidence that complicates your conclusion", "Separate observations, interpretations, uncertainty and ethical considerations"], "correct": 2, "why": "Strong archaeological arguments distinguish what was observed from what is inferred and acknowledge limits.", "think": "Which part of your report would you most want a descendant community to read?", "art": "dossier"}]}], "glossary": [["Artifact", "A portable object made, modified or used by people, such as a blade, pot or bead."], ["Ecofact", "Natural remains that reveal human activity or past environments: seeds, animal bones, pollen, shells."], ["Feature", "A nonportable trace of human activity, such as a hearth, pit, wall or posthole. It can be recorded but not carried away."], ["Context", "Where something was found and what it was found with: its layer, position and associations. Without context, an object loses most of its story."], ["Stratigraphy", "The study of layered deposits. Layers, and the cuts through them, record the order of events at a site."], ["Superposition", "In undisturbed deposits, lower layers are generally older than the layers above them."], ["Radiocarbon dating", "Dates once-living material (charcoal, seeds, bone) by measuring the decay of carbon-14, back to roughly 50,000 years."], ["Dendrochronology", "Tree-ring dating: matching patterns of annual growth rings to a reference sequence to find calendar years."], ["Argon dating", "Potassium–argon and related methods date suitable volcanic rock and ash, often far older than radiocarbon can reach."], ["Seriation", "Ordering artifacts into a relative sequence based on gradual changes in style or frequency."], ["Paleoclimate proxy", "A natural record, such as a stalagmite, ice core or lake sediment, that preserves signals of past climate."], ["Pseudoarchaeology", "Claims about the past that look like archaeology but ignore its evidence and methods, often relying on mystery."], ["Argument from ignorance", "\"We can't explain it, so it must be X.\" A gap in knowledge never proves a particular alternative."], ["Cherry-picking", "Showing only the evidence that fits a story while ignoring the rest of the record."], ["Correlation ≠ causation", "Two things happening at the same time does not show that one caused the other."], ["Repatriation", "Returning ancestral remains or cultural items to descendant communities. In the U.S., NAGPRA sets legal requirements."], ["Cultural resource management", "CRM: identifying, evaluating and managing the effects of development on archaeological and cultural heritage."]], "hbArt": {"Artifact": "potsherd", "Ecofact": "seed", "Feature": "hearth", "Context": "trowel", "Stratigraphy": "strata", "Superposition": "strata", "Radiocarbon dating": "radiocarbon", "Dendrochronology": "treering", "Argon dating": "volcano", "Seriation": "potsherd", "Paleoclimate proxy": "stalagmite", "Pseudoarchaeology": "ufo", "Argument from ignorance": "brain", "Cherry-picking": "cherries", "Correlation ≠ causation": "chart", "Repatriation": "box", "Cultural resource management": "bulldozer"}, "detReadings": [], "detFullTexts": [], "detOther": [], "moreTools": []};</script><script>const ART=(()=>{

function detective(t){const d=deckById('detective'),r=D.detReadings[t],full=D.detFullTexts[t];const my=tok;
 const used=new Set();const paras=full[1].map(par=>{const np=norm(par);const hits=[];r.pieces.forEach((p,i)=>{const k=np.indexOf(norm(p[0]));if(k>-1){hits.push([k,k+p[0].length,i]);used.add(i)}});hits.sort((a,b)=>a[0]-b[0]);let h='',pos=0;hits.forEach(([a,b,i])=>{if(a<pos)return;h+=esc(par.slice(pos,a))+`<button class="clue ${clueState(t,i)}" data-clue="${i}" aria-label="Suspicious passage ${i+1}">${esc(par.slice(a,b))}</button>`;pos=b});h+=esc(par.slice(pos));return `<p>${h}</p>`}).join('');
 const extra=r.pieces.map((p,i)=>used.has(i)?'':`<p><button class="clue ${clueState(t,i)}" data-clue="${i}">${esc(p[0])}</button></p>`).join('');
 const found=r.pieces.filter((p,i)=>seen('detective:'+t+':p'+i)).length;
 view.innerHTML=`<div class="invbar"><button class="back" id="backBtn">← Case board</button><span class="casename">${esc(d.tab)} · BAD SCIENCE DETECTIVE</span></div>
 <div class="tabs" role="tablist">${D.detReadings.map((x,j)=>`<button class="tab" role="tab" aria-selected="${j===t}" data-tab="${j}">Reading ${j+1}</button>`).join('')}</div>
 <article class="sheet"><div class="kicker">EVIDENCE FILE · READING ${t+1}</div><h2>${esc(r.title)}</h2><p class="muted" style="margin:0">${esc(r.source)}</p><p>${esc(r.intro)}</p>
 <h3>Part A · Interrogate the suspects</h3><p class="muted" style="margin-top:0">The highlighted passages are suspects. Click one to name the problem. A highlighted passage isn't automatically false: your job is to find the limits of the claim. <strong style="font-family:var(--type)">Suspects questioned: ${found}/${r.pieces.length}</strong></p>
 <div class="doc"><h4>${esc(full[0])}</h4>${paras}${extra?`<p class="muted" style="font-family:var(--type);font-size:.8rem;margin-bottom:0">Also flagged in this reading:</p>${extra}`:''}</div>
 <div id="interro"></div>
 <h3>Part B · Evaluate the evidence</h3><div id="partB">${r.questions.map((q,i)=>detQ(t,i)).join('')}</div>
 <h3>Part C · Think like an anthropologist <span class="muted" style="font-size:.85rem">(ungraded)</span></h3><p>Identify one cultural assumption or value in this reading. How could it shape what the writer considers persuasive? For the smoking-ban letter, also rewrite one problematic sentence to make a stronger argument.</p>
 <label class="sr" for="reflect">Your analysis</label><textarea class="reflect" id="reflect" placeholder="Write your analysis here…">${esc((LS.get('ad1_reflect',{})||{})[t]||'')}</textarea><p class="muted" style="font-size:.85rem">Saved in this browser as you type. It is not sent to your instructor automatically.</p><button class="btn" onclick="window.print()">Print / save reflection</button></article>`;
 $('#backBtn').onclick=()=>go('board');
 $$('[data-tab]',view).forEach(b=>b.onclick=()=>go('deck',{deck:'detective',tab:Number(b.dataset.tab)}));
 $$('[data-clue]',view).forEach(b=>b.onclick=()=>interrogate(t,Number(b.dataset.clue)));
 bindDetQ(t);
 $('#reflect').oninput=e=>{const m=LS.get('ad1_reflect',{})||{};m[t]=e.target.value;LS.set('ad1_reflect',m)};
 Prof.say(d.prof,'inspecting',true)}
function clueState(t,i){const a=answers['detective:'+t+':p'+i];if(a===undefined)return '';return 'solved'+(a===detOpts(t,i).correct?'':' miss')}
function interrogate(t,i){const my=++tok;skipping=false;const p=D.detReadings[t].pieces[i],{opts,correct}=detOpts(t,i),key='detective:'+t+':p'+i,prev=answers[key];
 const box=$('#interro');box.innerHTML=`<div class="interro"><div class="qlabel">INTERROGATION · SUSPECT ${i+1}</div><blockquote>“${esc(p[0])}”</blockquote><p class="tw" id="twI" aria-hidden="true" style="font-weight:700;font-size:1.1rem"></p><span class="sr">What is the strongest concern about this passage?</span><div class="cards" id="icards">${opts.map((o,j)=>`<button class="icard" data-c="${j}"><span class="lt">${String.fromCharCode(65+j)}</span><span class="txt">${esc(o)}</span></button>`).join('')}</div><div id="inotes"></div></div>`;
 box.scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'});
 const cards=$('#icards');const verdict=(c,anim)=>{const ok=c===correct;$$('.icard',cards).forEach(b=>{const j=Number(b.dataset.c);b.disabled=true;if(j===correct)b.classList.add('right');else if(j===c)b.classList.add('wrong');else b.classList.add('dim')});cards.classList.add('done');$('#inotes').innerHTML=`<section class="notes"><h4>${ok?'Prof Honey’s notes · suspect identified':'Prof Honey’s notes · the stronger reading'}</h4><p><strong>${esc(p[1])}.</strong> ${esc(p[2])}</p></section>`;const cl=$(`[data-clue="${i}"]`);if(cl)cl.className='clue solved'+(ok?'':' miss');if(anim){sfx.stamp();Prof.react(ok,'debunk')}};
 $$('.icard',cards).forEach(b=>b.onclick=()=>{if(answers[key]!==undefined)return;const c=Number(b.dataset.c);record(key,c);award(key,c===correct);verdict(c,true)});
 if(prev!==undefined){$('#twI').textContent='What is the strongest concern about this passage?';cards.classList.add('instant');verdict(prev,false);Prof.say(prev===correct?'You already identified this suspect.':'You missed this suspect. My notes show the stronger reading.',prev===correct?'cracked':'falselead',false,'swap');return}
 cards.style.visibility='hidden';Prof.say("Interrogate the suspect. What's wrong with this passage?",'close',false,'swap');
 type($('#twI'),'What is the strongest concern about this passage?',20,my).then(()=>{if(my!==tok)return;cards.style.visibility='';cards.classList.add('show')})}
function detQ(t,i){const q=D.detReadings[t].questions[i],key='detective:'+t+':q'+i,a=answers[key];return `<div class="interro" data-q="${i}"><div class="qlabel">QUESTION ${i+1}</div><p style="font-weight:700;font-size:1.05rem;margin:.3em 0 .2em">${esc(q[0])}</p><div class="cards instant">${q[1].map((o,j)=>`<button class="icard ${a!==undefined?(j===q[2]?'right':j===a?'wrong':'dim'):''}" data-dq="${i}" data-c="${j}" ${a!==undefined?'disabled':''}><span class="lt">${String.fromCharCode(65+j)}</span><span class="txt">${esc(o)}</span></button>`).join('')}</div>${a!==undefined?`<section class="notes" style="animation:none"><h4>${a===q[2]?'Prof Honey’s notes · correct':'Prof Honey’s notes · review the evidence'}</h4><p>${esc(q[3])}</p></section>`:''}</div>`}
function bindDetQ(t){$$('[data-dq]',view).forEach(b=>b.onclick=()=>{const i=Number(b.dataset.dq),q=D.detReadings[t].questions[i],key='detective:'+t+':q'+i;if(answers[key]!==undefined)return;const c=Number(b.dataset.c);record(key,c);award(key,c===q[2]);sfx.stamp();Prof.react(c===q[2],'debunk');const wrap=b.closest('[data-q]');wrap.outerHTML=detQ(t,i);const nw=$(`[data-q="${i}"]`,view);bindDetQ(t);const n=$('.notes',nw);if(n)n.style.animation=''})}

/* ---------- videos ---------- */
function videos(d){view.innerHTML=bar(d,null)+`<article class="sheet"><div class="kicker">${esc(d.tab)}</div><h2>${esc(d.title)}</h2><p>${esc(d.intro)} Other files keep their own section scores. Show each score to your instructor.</p></article><div id="vlabHost" style="margin-top:22px"></div>`;
 bindBar(d);Prof.say(d.prof,'inspecting',true);
 const host=$('#vlabHost');let R;try{R=host.attachShadow({mode:'open'})}catch(e){host.innerHTML='<p class="sheet">This browser cannot show the video room. Please try an up-to-date Chrome, Edge, Firefox or Safari.</p>';return}
 R.innerHTML='<style>'+VLAB.css+'</style>'+VLAB.html;
 try{VLAB.init(R,()=>go('deck',{deck:'videos'}))}catch(e){console.error(e)}
 R.querySelectorAll('video').forEach(v=>v.addEventListener('error',()=>{if(v.nextElementSibling&&v.nextElementSibling.classList.contains('vl-missing'))return;const m=document.createElement('p');m.className='vl-missing';m.innerHTML='<strong>This video file could not be loaded.</strong> The videos only play from the full lesson package: the <em>videos</em> folder must sit next to index.html. If you are viewing a single preview file, upload or open the complete package instead.';v.insertAdjacentElement('afterend',m)}))}

/* ---------- handbook + locker ---------- */
const HB_ART=D.hbArt;
const HB_LENS='<svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="50" cy="50" r="33" fill="#fffdf3" stroke="#111" stroke-width="7"/><text x="50" y="64" text-anchor="middle" font-family="Courier New,monospace" font-weight="700" font-size="40" fill="#c0202b">?</text><path d="M34 33q9-10 22-10" stroke="#9a9a9a" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M74 74L105 105" stroke="#111" stroke-width="13" stroke-linecap="round"/><path d="M76 76L103 103" stroke="#c0202b" stroke-width="5" stroke-linecap="round"/></svg>';
let hbPage=0,hbEndSaid=false;
function hbPageHTML(p){const G=D.glossary,n=G.length;
 if(p===0)return `<div class="fb-page fb-cover" data-p="0"><div class="fb-cv-top">CASE FILE · FIELD REFERENCE</div><div class="fb-cv-title">THE DETECTIVE'S<br>HANDBOOK</div><div class="fb-cv-sub">${n} terms every investigator needs</div><div class="fb-cv-lens">${HB_LENS}</div><div class="fb-cv-prop">PROPERTY OF <b>PROF HONEY</b></div><span class="fb-cv-stamp">CONFIDENTIAL</span><div class="fb-cv-hint">TAP TO OPEN ▸</div></div>`;
 if(p>n)return `<div class="fb-page fb-cover fb-back" data-p="${p}"><div class="fb-cv-top">END OF HANDBOOK</div><div class="fb-cv-title">CASE<br>CLOSED</div><div class="fb-cv-sub">You've read every entry. Now put it to work.</div><div class="fb-cv-lens">${HB_LENS}</div><button class="btn red" data-hbgo="board">Open the case board →</button><span class="fb-cv-stamp">FILED</span><div class="fb-cv-hint">◂ BACK TO REVIEW ANY ENTRY</div></div>`;
 const [t,d]=G[p-1],art=HB_ART[t]||'dossier';
 return `<div class="fb-page" data-p="${p}"><div class="fb-hdr"><span>ENTRY ${String(p).padStart(2,'0')} / ${n}</span><span>FIELD HANDBOOK</span></div><div class="fb-body"><figure class="fb-sketch" aria-hidden="true"><i class="fb-tape"></i><svg viewBox="0 0 240 170">${ART[art]||''}</svg></figure><div class="fb-txt"><h3 class="fb-term">${esc(t)}</h3><p class="fb-def" aria-hidden="true" data-def="${esc(d)}">${esc(d)}</p><span class="sr">${esc(d)}</span></div></div><div class="fb-foot">p.${p}</div></div>`}
function hbSync(){const n=D.glossary.length,c=$('#fbCount');if(!c)return;
 c.textContent=hbPage===0?'COVER':hbPage>n?'BACK COVER':'ENTRY '+hbPage+' OF '+n;
 $('#fbPrev').disabled=hbPage===0;$('#fbNext').disabled=hbPage>n;$('#fbNext').textContent=hbPage===0?'Open →':'Next →';
 $$('.fb-tab').forEach(b=>{const on=+b.dataset.hbp===hbPage;b.classList.toggle('on',on);b.setAttribute('aria-current',on?'page':'false')})}
function hbFlip(to){const st=$('#fbStack');if(!st)return;const n=D.glossary.length;to=Math.max(0,Math.min(n+1,to));
 const cur=st.querySelector('.fb-page:not(.leaving)');if(cur&&to===hbPage)return;const dir=to>hbPage?1:-1;hbPage=to;skipping=false;const my=++tok;
 const tmp=document.createElement('div');tmp.innerHTML=hbPageHTML(to);const nw=tmp.firstElementChild;
 if(!cur||reduce){st.innerHTML='';st.appendChild(nw)}
 else if(dir>0){st.insertBefore(nw,cur);cur.classList.add('leaving','fb-up');setTimeout(()=>cur.remove(),650)}
 else{st.appendChild(nw);nw.classList.add('fb-down');cur.classList.add('leaving');setTimeout(()=>{cur.remove();nw.classList.remove('fb-down')},650)}
 if(cur)sfx.page();hbSync();
 const def=$('.fb-def',nw);if(def&&!reduce){const full=def.dataset.def;def.textContent='';setTimeout(()=>{if(my===tok)type(def,full,12,my)},cur?(dir>0?260:420):150)}
 const b=$('[data-hbgo]',nw);if(b)b.onclick=e=>{e.stopPropagation();go(b.dataset.hbgo)};
 if(to>n&&!hbEndSaid){hbEndSaid=true;Prof.say("That's the whole book. Now go crack some cases.",'thinking',false,'swap')}}
function handbook(){const G=D.glossary;if(hbPage>G.length+1)hbPage=0;
 view.innerHTML=`<article class="sheet hb"><div class="kicker">THE DETECTIVE'S HANDBOOK</div><h2>Know your terms</h2><p class="muted" style="margin-top:0">Flip through Prof Honey's notebook. Tap the page, swipe, or use the arrow keys.</p>
 <div class="fb"><div class="fb-pad" role="region" aria-label="Detective's handbook, flip notebook"><span class="fb-rings" aria-hidden="true"></span><div class="fb-stack" id="fbStack"></div></div>
 <div class="fb-nav"><button class="btn" id="fbPrev">← Back</button><span class="fb-count" id="fbCount" aria-live="polite"></span><button class="btn red" id="fbNext">Next →</button></div>
 <div class="fb-index" role="group" aria-label="Jump to a term"><span class="fb-index-lab">INDEX</span>${G.map(([a],i)=>`<button class="fb-tab" data-hbp="${i+1}">${esc(a)}</button>`).join('')}</div></div>
 <dl class="fb-print">${G.map(([a,b])=>`<dt>${esc(a)}</dt><dd>${esc(b)}</dd>`).join('')}</dl></article>
 <article class="sheet"><div class="kicker">FIELD GUIDE</div><h2>Ask five questions</h2><ol class="steps"><li><span>Where was it found, and what was it found with?</span></li><li><span>What was observed, and what is interpretation?</span></li><li><span>How was it dated, and how certain is the date?</span></li><li><span>Do independent lines of evidence agree?</span></li><li><span>Whose past is this, and have they been heard?</span></li></ol>
 <p style="border:2px solid #000;background:#fff9ea;padding:10px 12px"><strong>Important:</strong> “I don’t know yet” is often the most scientifically responsible answer. A gap in our knowledge is not proof of aliens or lost civilizations, and new evidence can revise even well-supported interpretations.</p>
 <h3>Archaeology connections</h3><p><strong>Context:</strong> Excavation destroys the original deposit, so the record becomes the evidence. <strong>Multiple lines of evidence:</strong> Climate proxies, skeletons, dates and texts are strongest together. <strong>Indigenous knowledge:</strong> Oral histories can be vital evidence and guide ethical interpretation. <strong>Colonial narratives:</strong> Stories of vanished peoples or outside builders often erase living descendants.</p>
 <button class="btn" onclick="window.print()">Print / save handbook as PDF</button></article>`;
 const st=$('#fbStack');let sx=null,sy=null,swiped=false;
 st.addEventListener('touchstart',e=>{const t=e.changedTouches[0];sx=t.clientX;sy=t.clientY;swiped=false},{passive:true});
 st.addEventListener('touchend',e=>{if(sx===null)return;const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;sx=null;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.3){swiped=true;hbFlip(hbPage+(dx<0?1:-1))}},{passive:true});
 st.onclick=()=>{if(swiped){swiped=false;return}if($('.fb-def.typing',st)){skipping=true;return}if(hbPage<=G.length)hbFlip(hbPage+1)};
 $('#fbPrev').onclick=()=>hbFlip(hbPage-1);$('#fbNext').onclick=()=>hbFlip(hbPage+1);
 $$('.fb-tab').forEach(b=>b.onclick=()=>hbFlip(+b.dataset.hbp));
 const keep=hbPage;hbPage=-1;hbFlip(keep);
 Prof.say("My handbook. Flip through it whenever you need a definition.",'inspecting')}
function locker(){view.innerHTML=`<article class="sheet"><div class="kicker">EVIDENCE LOCKER</div><h2>Original sources</h2><p>These are original public-health, regulatory, research-methods, and historical sources, linked so you can investigate directly. Live dashboards may change over time.</p>
 <div class="bags" style="margin-top:20px">${D.cases.map(c=>`<div class="bag"><h3>${esc(c.title)}</h3>${c.links.map(l=>`<a href="${esc(l[1])}" target="_blank" rel="noopener noreferrer">${esc(l[0])} ↗</a>`).join('')}</div>`).join('')}<div class="bag"><h3>More tools for checking claims</h3>${D.moreTools.map(l=>`<a href="${esc(l[1])}" target="_blank" rel="noopener noreferrer">${esc(l[0])} ↗</a>`).join('')}</div></div>
 <p class="muted" style="margin-top:20px">The original examples and links provide context, not endorsements of any fictional advertisement. Check live source pages before class, especially changing outbreak statistics and regulations.</p></article>`;
 Prof.say("Real sources. A good detective always checks the original.",'inspecting')}

/* ---------- global wiring ---------- */
$('#globalDefs').innerHTML=ART_DEFS+PROF.DEFS;
$('#logoBtn').onclick=()=>go('home');
$$('.tbtn[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
$('#soundBtn').onclick=()=>setSound(!sfx.on);(()=>{const sb=$('#soundBtn');sb.textContent='Sound: '+(sfx.on?'on':'off');sb.setAttribute('aria-pressed',sfx.on?'true':'false')})();
document.addEventListener('keydown',e=>{if(e.target&&/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
 const typingNow=!!$('.typing',view);
 if(typingNow&&(e.key==='Enter'||e.key===' ')&&!(e.target&&e.target.tagName==='BUTTON')){skipping=true;e.preventDefault();return}
 if(route.v==='handbook'&&(e.key==='ArrowRight'||e.key==='ArrowLeft')&&$('#fbStack')){e.preventDefault();hbFlip(hbPage+(e.key==='ArrowRight'?1:-1));return}
 if(route.v==='deck'&&typeof route.i==='number'){const cards=$('#cards');if(cards&&cards.style.visibility!=='hidden'&&!cards.classList.contains('done')){const k=e.key.toLowerCase();let idx='abcd'.indexOf(k);if(idx<0)idx='1234'.indexOf(k);if(idx>-1&&idx<$$('.icard',cards).length){e.preventDefault();choose(deckById(route.deck),route.i,idx);return}}
  if(e.key==='ArrowRight'){const n=$('#next');if(n&&!n.disabled)n.click()}}});
updatePts();
(function(){const d=$('#desk');if(!d)return;const fit=()=>{d.classList.remove('unstick');if(innerWidth>900&&d.offsetHeight>innerHeight-86)d.classList.add('unstick')};addEventListener('resize',fit);if(window.ResizeObserver)new ResizeObserver(fit).observe(d);fit()})();
render();
})();
</script></body></html>
