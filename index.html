<script>const DATA={"cases":[{"id":"snake","icon":"🐍","title":"Snake Oil Never Dies","time":"8–10 min","topic":"Historic fraud and modern marketing","intro":"An actual radioactive “health tonic” offers a warning about scientific-sounding sales pitches.","real":"**REAL HISTORICAL CASE:** Radithor was sold in the United States in the 1920s and early 1930s as a radioactive patent medicine. The product contained radium; its use was associated with severe harm, including the widely reported death of Eben Byers. The promotional cards below are SIMULATIONS, not reproductions of archival ads.","links":[["Oak Ridge Associated Universities: Radithor collection","https://www.orau.org/health-physics-museum/collection/patent-medicines/radithor.html"],["FDA: Health fraud scams","https://www.fda.gov/consumers/health-fraud-scams"]],"questions":[{"post":"📜 SIMULATED 1930s-STYLE AD|“RADIUM: THE POWER OF MODERN SCIENCE! Restore your vigor with our revolutionary tonic.”","q":"What is the strongest reason to be skeptical of this sales pitch?","opts":["It invokes scientific progress without showing controlled evidence of safety or benefit.","All new medical treatments are unsafe.","Any product sold in the past must have been fraudulent.","Scientific terms are always meaningless in advertising."],"correct":0,"why":"Scientific vocabulary and novelty are not proof of efficacy or safety. Radithor is a real historical example of a harmful product marketed with scientific prestige.","think":"How can the cultural prestige of science itself be used to sell pseudoscience?"},{"post":"📱 SIMULATED WELLNESS AD|“Ancient wisdom + quantum energy = total cellular renewal. Thousands of happy customers!”","q":"Which evidence would best test the advertised health benefit?","opts":["A celebrity testimonial.","A well-designed controlled study measuring meaningful health outcomes.","A large follower count.","An explanation using more technical-sounding words."],"correct":1,"why":"Controlled comparisons and clinically meaningful outcomes provide stronger evidence than testimonials, popularity, or jargon.","think":"Why might “ancient” and “high-tech” be persuasive together?"},{"post":"🧾 SIMULATED PRODUCT LABEL|“Supports wellness*” with tiny print: “Not intended to diagnose, treat, cure, or prevent disease.”","q":"What should a careful consumer conclude?","opts":["The disclaimer proves the product is harmful.","The product has been proven to treat disease.","The marketing claim needs independent evidence; the disclaimer does not establish effectiveness.","The asterisk guarantees government approval."],"correct":2,"why":"Marketing language and disclaimers are not substitutes for evidence. Different categories of products face different regulatory requirements.","think":"Who benefits when consumers confuse marketing claims with clinical proof?"}]},{"id":"vax","icon":"💉","title":"The Vaccine Conspiracy","time":"10–12 min","topic":"Measles, causation, and science denial","intro":"Separate genuine safety monitoring from unsupported claims—and examine why population-level effects matter.","real":"**REAL-WORLD CONTEXT:** Measles is highly contagious. CDC surveillance documents U.S. cases and outbreaks; two doses of MMR vaccine are about 97% effective at preventing measles. The social media posts below are SIMULATED composites, not quotations from real individuals. Consult the live CDC dashboard for current counts rather than treating a saved number as current.","links":[["CDC: Measles cases and outbreaks","https://www.cdc.gov/measles/data-research/index.html"],["CDC: Measles vaccination","https://www.cdc.gov/measles/vaccines/index.html"],["WHO: Vaccine safety","https://www.who.int/news-room/questions-and-answers/item/vaccines-and-immunization-vaccine-safety"]],"questions":[{"post":"📱 SIMULATED POST|“My cousin’s child had a fever after an MMR shot. That proves vaccines are dangerous and should be avoided.”","q":"What is the central reasoning error?","opts":["Assuming that a symptom after vaccination proves a serious harm or establishes overall risk.","Recognizing that vaccines can have side effects.","Asking whether a symptom was reported.","Seeking reliable safety information."],"correct":0,"why":"Mild fever can occur after MMR vaccination. A report of a symptom alone does not establish a serious adverse event or show that vaccine risks exceed benefits. Safety is evaluated through systematic evidence.","think":"How does a vivid personal story compare with evidence from many people?"},{"post":"📰 SIMULATED HEADLINE|“One researcher disagrees with vaccine consensus—so the science is split 50/50!”","q":"What is the best response?","opts":["Count the number of people quoted on each side.","Compare the quality and total weight of the evidence, not the number of opposing voices.","Assume all scientific disagreement is fraudulent.","Treat any minority view as automatically correct."],"correct":1,"why":"A disagreement does not imply equal evidentiary support. Scientific consensus is built from converging research, replication, and ongoing scrutiny—not a vote among headlines.","think":"When does journalistic “balance” create a misleading impression?"},{"post":"📊 PUBLIC HEALTH QUESTION|In a community, many people skip MMR vaccination after reading alarming posts.","q":"Which potential consequence matters beyond an individual family?","opts":["Only the family’s grocery costs.","Nothing; infectious disease decisions never affect others.","Reduced community protection, increasing opportunities for measles transmission.","Proof that every unvaccinated person will get measles."],"correct":2,"why":"Measles spreads readily where susceptible people cluster. Vaccination protects individuals and helps limit spread, including to people who cannot be vaccinated or have weaker immune responses.","think":"How do individual choices intersect with collective responsibility?"}]},{"id":"food","icon":"🍓","title":"Is Your Food Poisoning You?","time":"10–12 min","topic":"Food dyes, seed oils, and risk","intro":"Investigate the actual research behind the 2025 U.S. Red No. 3 decision, then test viral claims about dyes, seed oils, and fruit.","real":"**WHAT WAS ACTUALLY STUDIED?** Long-term laboratory studies in rats, including studies published in the 1980s, examined erythrosine (FD&C Red No. 3), a synthetic color additive. Male rats exposed to high doses developed thyroid tumors. Researchers and regulators investigated a thyroid-hormone-related mechanism in rats; the FDA states that this mechanism does not occur in humans. **WHAT DID THE FDA DO?** On January 15, 2025, the FDA revoked authorization to use Red No. 3 in foods and ingested drugs under the Delaney Clause, which requires action when an additive is found to induce cancer in humans or animals. **WHAT DID IT NOT CONCLUDE?** The FDA did not establish that ordinary consumption of foods containing Red No. 3 causes cancer in children or adults. The agency says available scientific information does not support that claim. This is a regulatory decision based on an animal finding and a legal standard, not proof of human cancer from red candy. The social-media posts in this activity are SIMULATED.","links":[["FDA: FD&C Red No. 3","https://www.fda.gov/industry/color-additives/fdc-red-no-3"],["American Heart Association: Dietary fats","https://www.heart.org/en/healthy-living/healthy-eating/eat-smart/fats"]],"questions":[{"post":"📱 SIMULATED POST|“RED DYE BANNED! Scientists PROVED every red candy causes cancer in children!”","q":"Compare this post with the Red No. 3 rat-study dossier above. What does the post claim that the research did not establish?","opts":["A regulatory action is impossible without proof of human cancer.","It turns a specific animal finding and legal decision into a claim of proven human harm.","Food additives are never studied.","All animal studies are useless."],"correct":1,"why":"The actual evidence concerned thyroid tumors in male rats given high doses of erythrosine (Red No. 3), not cancer in children eating red candy. The FDA revoked authorization in January 2025 under the Delaney Clause. Its explanation says the rat-specific mechanism does not occur in humans and available evidence does not support claiming that food uses of Red No. 3 cause human cancer. The distinction is between an animal hazard finding, a legal prohibition, and a demonstrated risk at typical human exposure.","think":"How might “banned” become a symbol of danger independent of actual exposure?"},{"post":"🛒 SIMULATED INFLUENCER AD|“Seed oils are TOXIC. Throw them all away! Buy my $59 ancestral cooking kit.”","q":"What is the most evidence-based approach?","opts":["Assume any “natural” replacement is healthier.","Reject all nutrition research because advice changes.","Compare the claim with broad dietary evidence and check the seller’s financial interest.","Accept the claim because it uses the word “toxic.”"],"correct":2,"why":"Sweeping claims that all seed oils are toxic are not supported by the overall evidence. Replacing saturated fats with unsaturated fats is generally associated with cardiovascular benefit. Cooking methods and overall diet also matter.","think":"What does the appeal to “ancestral purity” suggest about cultural ideas of food?"},{"post":"🍎 SIMULATED REEL|“Apples contain CHEMICALS! Protect your family: never eat fruit again.”","q":"Which question is most important before deciding that a substance poses a meaningful health risk?","opts":["What substance, at what dose and exposure, and with what evidence of harm?","Can its name be made to sound frightening?","Is it found in a natural food?","Does the creator use alarming music?"],"correct":0,"why":"The presence of a chemical does not establish danger. Identity, dose, exposure, biological effects, and the quality of the evidence are essential to risk assessment.","think":"How do “pure” and “contaminated” become moral categories?"}]},{"id":"lab","icon":"🔬","title":"The Bad Science Laboratory","time":"10–12 min","topic":"Study design, headlines, and bias","intro":"Investigate how a tiny piece of research can turn into a giant claim.","real":"**METHODS LAB:** The research scenarios below are intentionally FICTIONAL. They illustrate common distortions; they are not descriptions of actual published studies.","links":[["NIH: Understanding clinical studies","https://www.nih.gov/health-information/nih-clinical-research-trials-you/basics"],["Cochrane: Evidence synthesis","https://www.cochrane.org/evidence"]],"questions":[{"post":"📰 SIMULATED HEADLINE|“STRAWBERRIES CAUSE CANCER!” Fine print: 12 mice received extremely high doses of an isolated compound.","q":"What can we reasonably conclude?","opts":["Eating ordinary amounts of strawberries causes cancer in humans.","The animal experiment raises a question, but does not establish the headline’s claim about people eating fruit.","All studies involving mice are fraudulent.","The headline is correct because the study involved a chemical."],"correct":1,"why":"An animal experiment with extreme exposure cannot be directly generalized to ordinary human dietary exposure. The headline also changes an isolated compound into a claim about whole strawberries.","think":"What information was lost between the experiment and the headline?"},{"post":"📉 SIMULATED INFLUENCER|“I found ONE study that supports my claim. Ignore the 30 larger studies that disagree!”","q":"Which technique is most clearly illustrated?","opts":["Random assignment.","Peer review.","Cherry-picking evidence.","Replication."],"correct":2,"why":"Cherry-picking selectively highlights favorable findings while excluding contradictory evidence. A sound assessment weighs the totality and quality of relevant research.","think":"How could you search for studies that challenge your preferred conclusion?"},{"post":"📈 SIMULATED GRAPH|A chart shows two variables rising together: wellness-app use and reported anxiety.","q":"What is the most defensible interpretation?","opts":["The correlation alone cannot establish whether one causes the other.","The app definitely causes anxiety.","Anxiety definitely causes app use.","Both variables must be unrelated."],"correct":0,"why":"Correlation can reflect causation in either direction, confounding variables, or other explanations. More research is needed to identify causal relationships.","think":"What third factor might affect both variables?"}]},{"id":"money","icon":"💰","title":"Follow the Money","time":"8–10 min","topic":"Influencers, trust, and political economy","intro":"Who gains when ordinary life starts to look dangerous?","real":"**REAL-WORLD CONTEXT:** The U.S. Federal Trade Commission requires appropriate disclosure of material connections in endorsements, and health-product claims must be supported by adequate evidence. The influencer and products below are FICTIONAL teaching scenarios.","links":[["FTC: Endorsement Guides","https://www.ftc.gov/business-guidance/advertising-marketing/endorsements-influencers-reviews"],["FTC: Health Products Compliance Guidance","https://www.ftc.gov/business-guidance/resources/health-products-compliance-guidance"]],"questions":[{"post":"📱 SIMULATED CREATOR|“Your kitchen is full of hidden poisons! Link in bio for my $149 detox bundle. #partner”","q":"Which combination should investigators examine?","opts":["Only the creator’s number of followers.","The evidence for the hazard, the product’s efficacy, and the creator’s financial incentives.","Whether the creator appears friendly.","Whether the product packaging looks scientific."],"correct":1,"why":"Claims about danger and claims about a remedy each need evidence. A paid relationship is relevant context, though financial interest alone does not prove a claim false.","think":"How can fear be converted into consumer demand?"},{"post":"💬 SIMULATED COMMENT|“Doctors sometimes make mistakes, so no medical research can ever be trusted.”","q":"What is the best evaluation?","opts":["Institutional errors are impossible.","All outsider claims must be accepted.","Specific failures deserve scrutiny, but they do not invalidate all scientific methods and evidence.","Only doctors can evaluate evidence."],"correct":2,"why":"Critical scrutiny of institutions can be justified. Generalizing from real failures to blanket rejection of all evidence is a reasoning error. Independent replication and transparency help correct mistakes.","think":"How can justified distrust be exploited by someone selling a product?"},{"post":"📣 SIMULATED POST|“Share this immediately or your loved ones will suffer. They are hiding the truth!”","q":"Which technique is most prominent?","opts":["Urgency and fear combined with an unsupported conspiracy narrative.","A transparent systematic review.","A clear report of absolute risk.","A balanced explanation of uncertainty."],"correct":0,"why":"Emotional urgency can discourage verification. “They are hiding the truth” alleges a conspiracy without providing evidence. Pause and trace the claim before sharing.","think":"Why are fear and moral responsibility effective tools for persuasion?"}]}],"finalQs":[{"post":"🚨 FINAL MYSTERY — SIMULATED VIRAL POST|“A NEW STUDY PROVES supermarket vegetables are dangerous! The study tested a concentrated extract on 10 mice. Doctors are covering it up. Buy my $89 vegetable detox today. Share before it gets deleted!”","q":"What is the most important flaw in the scientific claim?","opts":["The study is automatically invalid because it used animals.","A small animal experiment with a concentrated extract cannot establish that eating supermarket vegetables harms humans.","The price of the product proves the study is false.","Any scientific study can prove any headline."],"correct":1,"why":"The leap from a small animal study using a concentrated extract to ordinary human food consumption is not justified.","think":"What were the subjects, exposure, and actual outcomes?"},{"post":"🕵️ FINAL MYSTERY|The creator links to a product checkout page but not the original study.","q":"What should you do next?","opts":["Share the post with a warning.","Assume the study exists and confirms the headline.","Trace the claim to the original research and check independent evidence.","Judge the claim by the number of likes."],"correct":2,"why":"Tracing the original study and looking for independent, high-quality coverage is a practical way to test the claim.","think":"Where did the evidence originate?"},{"post":"⚖️ FINAL MYSTERY|The influencer receives a commission for every detox kit sold.","q":"What conclusion best combines skepticism with fairness?","opts":["The conflict of interest is relevant, but the health claims still must be evaluated on evidence.","Any paid creator is always lying.","A financial relationship proves the detox works.","Disclosure makes scientific testing unnecessary."],"correct":0,"why":"Commercial incentives can shape messaging; they are a reason to scrutinize evidence, not an automatic proof of falsehood.","think":"Distinguish a reason for scrutiny from proof of falsity."}],"adCases":[{"style":"vintage","brand":"RADIANT VITALITY","headline":"A NEW AGE OF ENERGY!","pitch":"The radiant tonic for vigor and youthful strength. Powered by the marvel of radium!","icon":"⚗️","fine":"Daily vitality tonic • 1930s-inspired fictional exhibit","category":"unsupported","evidence":"Radium is radioactive. Historical radium tonics were marketed as health aids, but ingestion can cause severe harm. A scientific-sounding ingredient is not evidence of a health benefit.","reason":"This is a historically inspired fictional ad, not a reproduction of a specific archival advertisement. Its central health promise lacks credible evidence and the ingredient is hazardous.","source":"https://www.epa.gov/radiation/radionuclide-basics-radium","ask":"What would demonstrate both safety and benefit? Why might new technology sound trustworthy?"},{"style":"blue","brand":"COMMUNITY HEALTH CLINIC","headline":"TWO DOSES. STRONG PROTECTION.","pitch":"Two recommended MMR doses are about 97% effective at preventing measles.","icon":"🛡️","fine":"Public health information • no product for sale","category":"supported","evidence":"CDC reports that two doses of MMR vaccine are about 97% effective at preventing measles. Effectiveness is high, not absolute.","reason":"The numerical claim matches established CDC guidance. It does not claim perfect protection or promise zero side effects.","source":"https://www.cdc.gov/measles/vaccines/index.html","ask":"How does a population-level statistic differ from a guarantee for one person?"},{"style":"pink","brand":"PURE PANTRY™","headline":"YOUR KITCHEN IS TOXIC.","pitch":"Seed oils are poisoning your family. Replace them with our $79 ancestral cooking set today!","icon":"🫙","fine":"Limited-time bundle • sponsored post","category":"misleading","evidence":"Evidence does not support treating all seed oils as inherently poisonous. Health effects depend on overall dietary pattern, type and use of fat, and what it replaces. A sales incentive also merits scrutiny.","reason":"The ad turns a broad nutritional debate into an absolute threat and sells an expensive solution. The alarming claim is not justified by the evidence.","source":"https://www.heart.org/en/healthy-living/healthy-eating/eat-smart/fats/healthy-cooking-oils","ask":"What does the company gain if shoppers fear ordinary groceries?"},{"style":"green","brand":"EVERYDAY PRODUCE","headline":"EAT MORE FRUIT & VEG.","pitch":"A variety of fruits and vegetables can support a healthy eating pattern. Choose what fits your budget.","icon":"🥦","fine":"Food education campaign • no miracle promises","category":"supported","evidence":"Public-health dietary guidance recommends eating a variety of fruits and vegetables as part of a healthy dietary pattern. No single food prevents all disease.","reason":"This is a modest, qualified recommendation consistent with dietary guidance, not a promise of a cure.","source":"https://www.myplate.gov/eat-healthy/vegetables","ask":"Why might a boring, qualified claim be more credible than a dramatic one?"},{"style":"orange","brand":"COLOR ALERT","headline":"RED DYE = CANCER?","pitch":"A food dye was banned after animal research. Does that prove every red candy causes cancer in children?","icon":"🍬","fine":"Investigative headline • read before sharing","category":"uncertain","evidence":"FDA revoked authorization for FD&C Red No. 3 under the Delaney Clause after findings in male rats; FDA states the mechanism observed in rats does not occur in humans and available evidence does not show it causes cancer in humans. The headline is a question, not a proven human-risk conclusion.","reason":"The regulatory action is real, but the specific claim that every red candy causes cancer in children is unsupported. A careful investigator separates hazard findings, legal standards, exposure, and human evidence.","source":"https://www.fda.gov/industry/color-additives/fdc-red-no-3","ask":"What additional evidence would you need to estimate risk to people?"},{"style":"dark","brand":"NOVA CELL LABS","headline":"QUANTUM CELL RESET","pitch":"Our patented frequency sticker detoxifies cells overnight. Thousands swear by it!","icon":"✨","fine":"Shop now • testimonials • no study linked","category":"unsupported","evidence":"No credible controlled trial or specific, measurable biological mechanism is provided for this fictional sticker. Testimonials cannot establish that it works.","reason":"Technical vocabulary and popularity are substitutes for evidence here. The burden of proof rests with the advertiser.","source":"https://medlineplus.gov/evaluatinghealthinformation.html","ask":"What outcome would you measure in a fair test against a placebo?"}],"adLabels":{"supported":"Well supported","misleading":"Misleading / exaggerated","unsupported":"Unsupported / pseudoscientific","uncertain":"Insufficient evidence for the implied conclusion"},"biasCards":[{"term":"Confirmation bias","kind":"Cognitive bias","definition":"Favoring information that supports what we already believe while discounting conflicting evidence.","scenario":"A student trusts three videos criticizing vaccines but dismisses a large review because it contradicts their existing opinion.","question":"Which thinking pattern best explains the student’s selective trust?","options":["Confirmation bias","Availability heuristic","Sunk cost fallacy","False dilemma"],"answer":0,"why":"The student is giving extra weight to evidence that agrees with a prior belief. A better approach is to look deliberately for strong evidence on both sides."},{"term":"Availability heuristic","kind":"Cognitive bias","definition":"Judging how common or likely something is by how easily examples come to mind.","scenario":"After watching a viral video of a rare medical complication, a viewer assumes it happens frequently without checking incidence data.","question":"What is the most relevant cognitive shortcut?","options":["Anchoring bias","Availability heuristic","Appeal to nature","Ad hominem"],"answer":1,"why":"Vivid, memorable examples can feel common even when they are rare. Ask for rates and appropriate comparison groups."},{"term":"Negativity bias","kind":"Cognitive bias","definition":"Giving threatening or negative information disproportionate attention or weight.","scenario":"A colorful food advertisement highlights a frightening hypothetical hazard in enormous letters and hides reassuring context in tiny print.","question":"Which tendency is the ad most likely exploiting?","options":["Bandwagon effect","Post hoc fallacy","Negativity bias","Straw man"],"answer":2,"why":"Threatening information draws attention. Whether the risk is meaningful still depends on evidence, dose, and exposure."},{"term":"Authority bias","kind":"Cognitive bias","definition":"Giving a claim extra weight because it comes from a person perceived as authoritative.","scenario":"An actor wearing a white coat says a supplement works. Viewers trust the claim without asking about trials or qualifications.","question":"Which bias is the ad trying to trigger?","options":["Survivorship bias","Authority bias","Base-rate neglect","False cause"],"answer":1,"why":"The appearance of expertise can substitute for evidence in our judgments. Credentials and evidence should be checked separately."},{"term":"Anchoring bias","kind":"Cognitive bias","definition":"Relying too heavily on the first number or claim encountered.","scenario":"A supplement ad starts with “A lifetime of illness could cost $100,000!” before offering a $79 bottle; no evidence shows the bottle prevents illness.","question":"Which bias may shape how the price feels?","options":["Anchoring bias","Confirmation bias","Appeal to popularity","Hasty generalization"],"answer":0,"why":"The dramatic first number can anchor later judgments, making the product seem inexpensive even without proof of benefit."},{"term":"Survivorship bias","kind":"Cognitive bias / sampling error","definition":"Drawing conclusions from visible successes while overlooking failures or people who dropped out.","scenario":"A detox brand shows ten glowing customer testimonials but does not report outcomes for thousands of other customers.","question":"What is the clearest problem with this evidence?","options":["False dilemma","Survivorship bias","Appeal to nature","Circular reasoning"],"answer":1,"why":"Only selected success stories are visible. We need results for everyone studied, not just the people chosen for the advertisement."},{"term":"Post hoc (false cause)","kind":"Logical fallacy","definition":"Assuming that because one event followed another, the first caused the second.","scenario":"“I began taking our herbal drops on Monday. My cold improved on Thursday. Therefore, the drops cured it.”","question":"Which reasoning error is most direct?","options":["Post hoc (false cause)","Straw man","Appeal to authority","False dilemma"],"answer":0,"why":"Improvement after taking a product does not establish that the product caused it. Colds often improve without treatment."},{"term":"Appeal to nature","kind":"Logical fallacy","definition":"Assuming that something is safer or better simply because it is natural.","scenario":"“Our mushroom tonic is natural, so it is completely safe for everyone.”","question":"Which argument is being used?","options":["Ad hominem","Appeal to nature","Cherry-picking","Bandwagon appeal"],"answer":1,"why":"Natural substances can be beneficial, harmful, or neutral. Safety depends on the substance, dose, and person—not on whether it is natural."},{"term":"False dilemma","kind":"Logical fallacy","definition":"Presenting only two options when more possibilities exist.","scenario":"“Either buy our detox kit or accept that you do not care about your family’s health.”","question":"Which fallacy best describes the forced choice?","options":["Hasty generalization","False dilemma","Post hoc","Appeal to popularity"],"answer":1,"why":"The ad ignores many other ways to support health, including doing nothing about a product with unproven benefits."},{"term":"Hasty generalization","kind":"Logical fallacy","definition":"Drawing a broad conclusion from too little or unrepresentative evidence.","scenario":"“Two people in my gym felt better after avoiding tomatoes, so tomatoes are unhealthy for everyone.”","question":"Which error is most evident?","options":["Hasty generalization","Straw man","Appeal to authority","Anchoring"],"answer":0,"why":"Two experiences cannot establish a general population-wide health effect. Individual reactions also differ."},{"term":"Ad hominem","kind":"Logical fallacy","definition":"Attacking a person instead of addressing the evidence for their claim.","scenario":"A nutrition influencer replies to a researcher’s study by mocking the researcher’s appearance rather than discussing the methods.","question":"Which fallacy is illustrated?","options":["False cause","Ad hominem","Appeal to nature","Survivorship bias"],"answer":1,"why":"The personal attack does not tell us whether the study’s design, data, or conclusions are sound."},{"term":"Cherry-picking","kind":"Evidence manipulation","definition":"Selecting favorable studies or facts while ignoring relevant contrary evidence.","scenario":"An oil advertisement cites one small experiment but omits several larger reviews that reach a different conclusion.","question":"What is the most direct evidence problem?","options":["Availability heuristic","Cherry-picking","False dilemma","Anchoring"],"answer":1,"why":"The ad selects supportive evidence without considering the full research literature. Study quality and total evidence matter."}],"mythData":{"food":{"title":"🥗 Food Myth Busters","intro":"Investigate claims about ancestral diets, chemicals, plant breeding and hormones. The social posts are fictional; the research links are real.","items":[{"claim":"Our ancestors ate almost nothing but meat. A carnivore diet is the only evolutionarily correct human diet.","question":"What is the strongest scientific response?","opts":["One universal ancestral diet has been established.","Human ancestors ate varied foods across places and periods; past survival does not establish modern nutritional optimality.","All early humans avoided animal foods.","An ancient practice must be healthier than a modern one."],"answer":1,"explain":"Archaeology and paleoanthropology document both animal and plant foods, with substantial variation across environments and time. The naturalistic fallacy is treating what occurred in the past as what ought to be eaten now.","bias":"Appeal to antiquity; naturalistic fallacy; cherry-picking","ask":"How do environment, technology, and food availability shape diet?","source":"https://humanorigins.si.edu/research/whats-hot-human-origins/did-meat-make-us-human"},{"claim":"This snack contains ascorbic acid and dihydrogen monoxide. Never eat chemicals you cannot pronounce!","question":"Which investigation best tests this warning?","opts":["Check whether ingredients have unfamiliar names.","Assume all synthetic chemicals are harmful.","Identify the substances, their amounts, and evidence of harm at actual exposures.","Assume every food additive is harmless."],"answer":2,"explain":"Ascorbic acid is vitamin C; dihydrogen monoxide is water. All foods are made of chemicals. Safety depends on the particular substance, dose, exposure, and evidence—not whether a name sounds intimidating. Some additives do warrant careful evaluation.","bias":"Chemophobia; appeal to nature; fear appeal","ask":"How do labels like “pure” and “chemical-free” create symbolic boundaries?","source":"https://www.fda.gov/food/food-ingredients-packaging/food-additives-and-gras-ingredients-information-consumers"},{"claim":"Modern carrots and broccoli are unnatural mutants. Their ancestors looked different, so they are dangerous to eat.","question":"What is the key error?","opts":["Plant domestication proves all vegetables are unsafe.","A difference from wild ancestors alone does not establish a health hazard.","Every modern vegetable was made by genetic engineering.","Wild plants are always nutritionally superior."],"answer":1,"explain":"Selective breeding changed many crops over generations; it is distinct from modern genetic engineering. Being different from a wild ancestor does not itself establish harm. Genetically engineered foods should be evaluated by their specific traits and evidence.","bias":"Appeal to nature; genetic fallacy","ask":"Why might “ancestral” be equated with “pure” or “authentic”?","source":"https://www.fda.gov/food/consumers/agricultural-biotechnology"},{"claim":"Soy milk contains plant estrogens. That means it lowers testosterone and feminizes men.","question":"What does the best available clinical synthesis show?","opts":["The word phytoestrogen proves the claim.","A single personal story settles the issue.","Clinical trials consistently show major testosterone reductions.","A meta-analysis of clinical studies found no significant effect on measured male testosterone or estrogen levels."],"answer":3,"explain":"A 2021 meta-analysis of 38 clinical studies found no significant effects of soy protein or isoflavones on the measured reproductive hormones in men. Plant isoflavones are not equivalent to human estrogen. This claim also exploits gender anxiety.","bias":"Equivocation; fear appeal; gender stereotyping","ask":"How does anxiety about masculinity influence what counts as a convincing health warning?","source":"https://pubmed.ncbi.nlm.nih.gov/33383165/"},{"claim":"One laboratory study found a food chemical harmed cells at an enormous concentration. Therefore one serving of the food is dangerous.","question":"What important information is missing?","opts":["Whether the exposure and experimental model are relevant to ordinary human consumption.","Whether the study has a dramatic title.","Whether the researcher is famous online.","Whether the ingredient has a long chemical name."],"answer":0,"explain":"Hazard under experimental conditions is not the same as risk at everyday exposures. Ask about dose, study design, replication, and human relevance. Do not dismiss a study solely because it is laboratory-based; evaluate what it can and cannot show.","bias":"Dose neglect; misleading extrapolation","ask":"Why do stories of contamination travel more readily than discussions of exposure?","source":"https://www.who.int/news-room/questions-and-answers/item/FAQ-genetically-modified-foods"}]},"vaccine":{"title":"💉 Vaccine Myth Busters","intro":"Evaluate real evidence behind common vaccine myths. The social posts are fictional and not quotations from actual people.","items":[{"claim":"A child developed autism after receiving MMR. The timing proves the vaccine caused it.","question":"Which evidence best tests causation?","opts":["The timing in a single story.","Comparative population studies evaluating autism rates in vaccinated and unvaccinated children.","How widely the story was shared.","The number of emotional comments."],"answer":1,"explain":"Temporal sequence alone does not establish causation. Large epidemiological studies have not found an increased autism risk from MMR vaccination. The 1998 paper that fueled this claim was retracted.","bias":"Post hoc fallacy; availability heuristic","ask":"How can a personal narrative feel more persuasive than a large study?","source":"https://www.healthychildren.org/English/safety-prevention/immunizations/Pages/vaccine-studies-examine-the-evidence.aspx"},{"claim":"Measles is a harmless childhood rite of passage. Natural infection is safer than vaccination.","question":"What should a careful comparison include?","opts":["Only stories from people who recovered.","Only the vaccine ingredients.","Risks of measles infection and its complications compared with risks and benefits of vaccination.","Whether measles was common in the past."],"answer":2,"explain":"Measles can cause pneumonia, encephalitis and death. MMR vaccination is highly effective; risks should be compared using evidence, not nostalgia about past infections.","bias":"Survivorship bias; appeal to tradition","ask":"How can cultural memories of childhood illness obscure the experiences of those harmed?","source":"https://www.cdc.gov/measles/about/index.html"},{"claim":"Vaccines contain chemical ingredients. Chemicals are poisons, so vaccines must be unsafe.","question":"What is the best way to evaluate this?","opts":["Judge the ingredients by their chemical names.","Assume no vaccine can ever have side effects.","Reject all ingredients that also occur elsewhere in nature.","Examine each ingredient, its function, amount, exposure, and safety evidence."],"answer":3,"explain":"All medicines and foods contain chemicals. Ingredient safety depends on substance and dose. Vaccines can have side effects, which are evaluated through clinical trials and ongoing safety monitoring.","bias":"Chemophobia; appeal to nature","ask":"Why is “chemical-free” a powerful marketing phrase?","source":"https://www.chop.edu/vaccine-education-center/vaccine-safety/vaccine-ingredients"},{"claim":"An outbreak happened even though some vaccinated people got sick. That proves vaccines do not work.","question":"What information is needed to assess effectiveness?","opts":["Infection rates among vaccinated and unvaccinated people, accounting for group sizes and exposure.","The raw number of vaccinated cases alone.","Whether the headline uses the word breakthrough.","Whether one vaccinated person became ill."],"answer":0,"explain":"No vaccine is 100% effective. When many people are vaccinated, some cases can occur among vaccinated people even when their individual risk is much lower. Compare rates and denominators, not isolated counts.","bias":"Base-rate neglect; all-or-nothing thinking","ask":"How can percentages and denominators change the meaning of a headline?","source":"https://www.cdc.gov/measles/vaccines/index.html"},{"claim":"A doctor online says vaccines are dangerous, while many large studies say otherwise. Both sides deserve equal scientific weight.","question":"How should scientific claims be weighed?","opts":["Every credentialed opinion has equal evidentiary weight.","The most confident speaker is most reliable.","Evaluate the quality, replication, and totality of evidence rather than giving every claim equal weight.","Count social media followers on each side."],"answer":2,"explain":"Scientific disagreements are assessed through methods, reproducibility and converging evidence. False balance treats unequally supported claims as equally credible. Criticizing a particular policy or institution is not the same as rejecting evidence.","bias":"False balance; appeal to authority","ask":"How can institutions build trust while acknowledging uncertainty and past mistakes?","source":"https://www.who.int/news-room/questions-and-answers/item/vaccines-and-immunization-vaccine-safety"}]}},"ancestralQuestions":[{"icon":"🦴","title":"Cut-marked animal bones","find":"At a prehistoric site, researchers document animal bones with stone-tool cut marks alongside stone artifacts.","question":"Which conclusion is BEST supported by this evidence alone?","opts":["People at this site processed animal carcasses.","Animal foods made up 90% of their calories.","All ancestral humans ate exclusively meat.","Eating mostly meat is optimal for people today."],"answer":0,"explain":"Cut marks can support carcass processing and access to animal tissue. They cannot establish total calorie proportions, the diets of every population, or modern health recommendations.","limit":"Preservation and excavation bias can make some food remains more visible than others.","link":"https://humanorigins.si.edu/evidence/behavior/stone-tools"},{"icon":"🌾","title":"Plants in the archaeological record","find":"Excavators recover charred seeds, grinding stones, and microscopic starch grains from ancient contexts.","question":"What is the most defensible interpretation?","opts":["Every person ate the same plants daily.","Plant foods were processed or present at this site, although their dietary contribution needs more evidence.","The community had a modern vegetarian diet.","No animal foods were consumed."],"answer":1,"explain":"Different types of plant evidence can demonstrate plant use, but quantities, timing, and individual diets are harder to infer.","limit":"Plant remains often preserve poorly; residues may have multiple possible origins.","link":"https://humanorigins.si.edu/evidence/behavior"},{"icon":"🧪","title":"An Ice Age isotope puzzle","find":"Stable-isotope results from human bone collagen suggest substantial reliance on animal-derived protein in one cold-climate population.","question":"What should a careful researcher conclude?","opts":["Every human population in history ate the same diet.","The results establish the ideal diet for modern humans.","The data inform protein sources for this sampled population, not a universal ancestral menu.","Isotopes directly measure every fruit and vegetable eaten."],"answer":2,"explain":"Bone collagen isotopes help reconstruct aspects of protein sourcing in a particular ecological and temporal setting. They do not directly reconstruct every calorie or establish what is healthiest now.","limit":"Interpretation depends on local food webs, baseline samples, and the tissue measured.","link":"https://www.nature.com/articles/s41598-019-41033-3"},{"icon":"🌍","title":"The perfect ancestral diet?","find":"One group lived near marine resources; another relied on seasonal plants and terrestrial animals. Their diets changed with climate and availability.","question":"Which claim best fits the evidence?","opts":["Evolution designed one precise menu for everyone.","Whatever ancestors ate must be healthiest today.","Variation in ancestral diets means diet has no relationship to health.","Human dietary flexibility undermines claims of a single universal ancestral diet."],"answer":3,"explain":"Dietary flexibility was important across environments and time. What people survived on in the past is not automatically the optimal modern diet.","limit":"Archaeological evidence informs past behavior; modern nutrition requires independent health-outcome evidence.","link":"https://humanorigins.si.edu/evidence/behavior"},{"title":"The evolutionary sales pitch","find":"SIMULATED AD: “Your DNA demands the ONE original human diet. Buy our $149 ancestral meal plan!”","question":"Which reasoning error is most central?","opts":["Appeal to antiquity/nature: old or ancestral automatically means healthier.","Randomized controlled trial evidence.","A direct measurement of modern health outcomes.","A documented universal human food tradition."],"answer":0,"explain":"An evolutionary story does not demonstrate health benefits. The ad also creates a financial incentive.","link":"https://humanorigins.si.edu/evidence/behavior"},{"title":"The missing denominator","find":"SIMULATED POST: “Researchers found animal bones at ten sites and edible plant remains at two. Clearly our ancestors almost never ate plants.”","question":"What is the strongest objection?","opts":["Animal bones cannot survive in soil.","Different preservation and recovery rates make simple site counts misleading.","Archaeologists never examine plant residues.","Finding plant remains proves a completely plant-based diet."],"answer":1,"explain":"Plant and animal remains have different preservation probabilities. Compare sampling and recovery methods before interpreting site counts.","link":"https://humanorigins.si.edu/evidence/behavior"},{"title":"What can an experiment show?","find":"SIMULATED STUDY: Twelve mice received a concentrated plant extract at doses far above ordinary dietary exposure.","question":"What would be an unjustified conclusion?","opts":["Researchers should report the dose.","Animal experiments can generate hypotheses.","Normal consumption of all vegetables is dangerous to humans.","Further studies might test human-relevant exposure."],"answer":2,"explain":"Species, dose, exposure, and outcomes matter; a concentrated extract in mice does not establish risks from eating vegetables.","link":"https://www.fda.gov/food/food-ingredients-packaging/food-additives-and-gras-ingredients-information-consumers"}],"glossary":[["Misinformation","False or misleading information shared regardless of intent."],["Disinformation","False or misleading information deliberately created or spread to deceive. Intent requires evidence; do not assume it from a post alone."],["Propaganda","Strategic communication designed to shape beliefs or behavior; it can include truths, omissions, and falsehoods."],["Pseudoscience","Claims that imitate science while lacking adequate testing, rigor, or responsiveness to contrary evidence."],["Science denial","Systematic rejection of well-supported evidence, often through selective evidence, conspiracies, or impossible demands for certainty."],["Cherry-picking","Selecting only evidence that favors a preferred conclusion."],["Anecdote","A personal account; useful for generating questions but usually weak evidence for general causal claims."],["Correlation ≠ causation","Two things varying together does not establish that one caused the other."],["Hazard vs. risk","Hazard is the capacity to cause harm; risk depends on exposure, dose, circumstances, and probability."],["Appeal to nature","Assuming something is safe or superior simply because it is described as natural."],["Conflict of interest","A relationship or incentive that could influence judgment; it warrants scrutiny but does not itself prove falsehood."],["Scientific consensus","The broad, evidence-based judgment of relevant experts, always open to revision when strong new evidence emerges."],["False balance","Presenting positions as equally supported when the weight of evidence is substantially unequal."],["SIFT","Stop; Investigate the source; Find better coverage; Trace claims, quotes, and media to the original context."]],"detReadings":[{"title":"Men Like Hot Women","source":"Classroom excerpt attributed to CNN.com / Indiana University research coverage; reproduced from instructor-provided material.","intro":"A news report describes a study of 46 adults at a speed-dating event in Germany. Identify how the report frames research and how far its conclusions can reasonably reach.","pieces":[["While humans may pride themselves on being highly evolved, most still behave like the stereotypical Neanderthals when it comes to choosing a mate","Loaded evolutionary analogy","The “Neanderthals” comparison is rhetorical and invokes a stereotype; it is not a measured research finding."],["though individuals may claim otherwise, beauty is the key ingredient for men","Overgeneralization","A sweeping statement about men is not established by the reported sample and setting."],["women, the much choosier of the sexes, leverage their looks for security and commitment","Gender essentialism / cultural assumption","The wording presumes a universal gender difference and motives not demonstrated by the excerpt alone."],["46 adults in a speed-dating session","Sampling / generalizability","A small sample from one event raises questions about representativeness and the reach of the headline."],["up to 30 different people, each date lasting anywhere from three to five minutes","Operationalization / ecological validity","A brief speed-date decision may not measure long-term mate selection or commitment."]],"questions":[["Which conclusion is best supported by the excerpt?",["The study proves all men prioritize beauty.","Researchers compared stated preferences with choices in a particular speed-dating setting.","The study proves women only seek financial security.","Evolutionary psychology cannot be studied scientifically."],1,"The described design concerns stated preferences and speed-dating decisions; broad claims about all people require more evidence."],["Which additional information would most improve your evaluation?",["Whether the findings were replicated in more varied populations and how traits were measured.","Whether the headline was popular.","Whether the reporter believes in evolution.","Whether the event took place in a large city."],0,"Sampling, measurement, effect sizes, and replication matter when judging generalizability."]]},{"title":"Vegetarians Live Longer","source":"Classroom excerpt attributed to HuffPost; instructor-provided passage.","intro":"The article reports a 21-year study of 1,904 participants and mortality comparisons among dietary groups. Distinguish reported associations from causal claims.","pieces":[["Are humans designed/evolved to eat everything and at risk of malnutrition as vegetarians? Or is vegetarianism the healthy and ethical choice?","False dilemma / framing","The opening sets up opposing choices and conflates nutritional evidence with ethical judgments."],["The most impressive data","Evaluative / promotional language","“Most impressive” is a value judgment, not a statistical result."],["The study’s shocking results: vegetarian men reduced their risk of early death by 50%!","Causal language / missing comparison","“Reduced” suggests causation; the excerpt does not establish random assignment, comparison baseline, or control for confounders."],["Women vegetarians benefit from a 30% reduction in mortality","Missing statistical context","The excerpt omits uncertainty intervals, baseline risks, comparison group details, and possible confounding factors."],["60 vegans (no animal products consumed), 1165 vegetarians (eating eggs, milk but no meat)","Unequal group sizes","A small vegan subgroup makes subgroup comparisons less precise; study details would be needed to assess uncertainty."],["results for moderate vegetarians was not statistically different from those for vegan or strict vegetarian diets","Misinterpretation risk","Not statistically different does not prove the groups are equivalent; precision and power matter."]],"questions":[["Which is the strongest follow-up question?",["Did the article use an exciting headline?","Were smoking, activity, age and other differences between groups accounted for?","Do all vegetarians have identical diets?","Was the study conducted in Europe?"],1,"Lifestyle and demographic confounding may explain some observed associations."],["What does “not statistically different” mean?",["The diets were proven identical in health effects.","The study found no statistically detectable difference; it may still have been too imprecise to rule out meaningful differences.","The study was fabricated.","All diets cause the same mortality."],1,"A nonsignificant difference is not proof of equivalence."]]},{"title":"University Smoking Ban — Letter to the Editor","source":"Instructor-provided classroom letter; argument for analysis, not a factual report of policy effects.","intro":"Identify argumentative fallacies without assuming that criticism of the smoking ban is necessarily invalid. Several sentences can support more than one interpretation.","pieces":[["I am a smoker, and I have a lot of friends who are smokers, and we all agree that this policy should be overturned","Anecdotal evidence / hasty generalization","The writer’s social circle does not establish the views of all campus members."],["the University has not instituted policies regarding many other behaviors related to health, such as exercising","Whataboutism / weak analogy","Other health behaviors do not directly settle whether exposure to secondhand smoke warrants regulation."],["What’s next? Will we ban potato chips and Cokes on campus? Will we force-feed broccoli and carrots to first-year students?","Slippery slope","The letter supplies no evidence that a smoking restriction leads to compulsory diets."],["That type of language asks students and faculty to be informants against each other","Loaded language / framing","“Informants” implies surveillance or betrayal without establishing what enforcement actually requires."],["either we are a freedom-loving campus or we aren’t","False dilemma","The campus may protect freedom while imposing some health and safety rules."],["I believe all of America’s veterans would agree with me","Unsupported consensus / appeal to patriotism","The writer cannot infer the views of all veterans or substitute patriotic association for evidence."],["Perhaps the Chancellor has an ulterior motive for instituting the ban and is using smokers as a scapegoat","Speculation about motive","The allegation provides no evidence of hidden intent; examine the stated rationale and effects instead."]],"questions":[["Which revision makes the strongest fair-minded argument?",["Either the campus values freedom or it does not.","The university should assess secondhand-smoke exposure and consider whether designated smoking areas could meet its health goals while limiting restrictions.","All veterans oppose this ban.","The chancellor secretly dislikes smokers."],1,"A stronger argument addresses evidence, competing interests, and plausible policy alternatives."],["Which statement is most accurate?",["If an argument contains a fallacy, its conclusion must be false.","A fallacy weakens the reasoning offered; the conclusion must still be evaluated on independent evidence.","Only people who oppose the policy use fallacies.","Anecdotes can never suggest useful research questions."],1,"Bad reasoning does not automatically prove the opposing position."]]}],"detFullTexts":[["CNN.com: Science News Headline – “Men Like Hot Women”",["BLOOMINGTON, Ind. -- While humans may pride themselves on being highly evolved, most still behave like the stereotypical Neanderthals when it comes to choosing a mate, according to research by Indiana University cognitive scientist Peter Todd.","In a new study, which will be published the week of Sept. 4-7 in the Proceedings of the National Academy of Sciences, Todd and colleagues found that though individuals may claim otherwise, beauty is the key ingredient for men while women, the much choosier of the sexes, leverage their looks for security and commitment.","The study used a speed-dating session in Germany to compare what people say they want in a mate with whom they actually choose. Speed dating, an increasingly popular way for singles to meet, involves sessions in which men and women have numerous \"mini dates\" with up to 30 different people, each date lasting anywhere from three to five minutes.","After every date, the men and women checked a box on a card noting whether they would like to see the other person again. For Todd's study, 46 adults in a speed-dating session were also asked to fill out a questionnaire beforehand assessing themselves and their ideal mate according to evolutionarily relevant traits, such as physical attractiveness, present and future financial status, health and parenting qualities."]],["Huffpost.com Science Headline: “The Benefits of Vegetarianism: Vegetarians Live Longer”",["Research Question: Are humans designed/evolved to eat everything and at risk of malnutrition as vegetarians? Or is vegetarianism the healthy and ethical choice? The most impressive data arises from a study of 1904 vegetarians over 21 years by the German Cancer Research Center (Deutsche Krebsforschungszentrum). The study's shocking results: vegetarian men reduced their risk of early death by 50%! Women vegetarians benefit from a 30% reduction in mortality. The participants of the German Cancer Research Center study included 60 vegans (no animal products consumed), 1165 vegetarians (eating eggs, milk but no meat) with the remainder described as \"moderate\" vegetarians who occasionally ate fish or meat. Living longer seems not to be exclusively related to eating meat, though, as the results for moderate vegetarians was not statistically different from those for vegan or strict vegetarian diets."]],["Reading 1 - Letter to the Editor",["The University of Mississippi recently passed a policy banning smoking on campus. I am a smoker, and I have a lot of friends who are smokers, and we all agree that this policy should be overturned. This policy is framed in terms of health outcomes and promoting individual well-being, but the University has not instituted policies regarding many other behaviors related to health, such as exercising. Furthermore, the University does nothing to sanction other forms of air pollution, such as automobile exhaust. Smoking is a right, and Americans have rights, so the smoking ban is wrong. What’s next? Will we ban potato chips and Cokes on campus? Will we force-feed broccoli and carrots to first-year students? People eighteen years old and up are adults and have the ability to make their own decisions regarding their health and habits. The policy also states, “All members of the university community share in the responsibility for adhering to and enforcing this policy.” That type of language asks students and faculty to be informants against each other. A college campus is a place for free expression of ideas and behaviors. It’s simple: either we are a freedom-loving campus or we aren’t. I choose freedom, and I believe all of America’s veterans would agree with me. Perhaps the Chancellor has an ulterior motive for instituting the ban and is using smokers as a scapegoat."]]],"foodDossier":{"title":"REAL STUDY DOSSIER — FD&C Red No. 3 (erythrosine)","rows":[["Research question","Could long-term exposure to this color additive produce tumors in laboratory animals?"],["Study subjects","Rats, with thyroid tumors observed in male rats."],["Exposure","High doses of the additive over extended periods—not children eating ordinary servings of candy."],["Observed outcome","Thyroid tumors in male rats."],["Regulatory action","In January 2025, the FDA revoked authorization for Red No. 3 in food and ingested drugs under the Delaney Clause."],["Your task","Decide which claims the study and decision do—or do not—establish. More context and the FDA source unlock after you answer."]]},"moreTools":[["SIFT: Mike Caulfield’s method","https://hapgood.us/2019/06/19/sift-the-four-moves/"],["MedlinePlus: Evaluating health information","https://medlineplus.gov/evaluatinghealthinformation.html"],["CDC: Measles overview","https://www.cdc.gov/measles/about/index.html"]],"detOther":["Sampling / generalizability","Causal language / missing comparison","False dilemma","Loaded evolutionary analogy","Gender essentialism / cultural assumption","Unequal group sizes","Slippery slope","Unsupported consensus / appeal to patriotism","Whataboutism / weak analogy","Missing statistical context","Operationalization / ecological validity","Anecdotal evidence / hasty generalization","Speculation about motive","Misinterpretation risk","Evaluative / promotional language","Loaded language / framing","Overgeneralization"]};</script><script>const ART=(()=>{

function clueState(t,i){const a=answers['detective:'+t+':p'+i];if(a===undefined)return '';return 'solved'+(a===detOpts(t,i).correct?'':' miss')}
function interrogate(t,i){const my=++tok;skipping=false;const p=D.detReadings[t].pieces[i],{opts,correct}=detOpts(t,i),key='detective:'+t+':p'+i,prev=answers[key];
 const box=$('#interro');box.innerHTML=`<div class="interro"><div class="qlabel">INTERROGATION · SUSPECT ${i+1}</div><blockquote>“${esc(p[0])}”</blockquote><p class="tw" id="twI" aria-hidden="true" style="font-weight:700;font-size:1.1rem"></p><span class="sr">What is the strongest concern about this passage?</span><div class="cards" id="icards">${opts.map((o,j)=>`<button class="icard" data-c="${j}"><span class="lt">${String.fromCharCode(65+j)}</span><span class="txt">${esc(o)}</span></button>`).join('')}</div><div id="inotes"></div></div>`;
 box.scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'});
 const cards=$('#icards');const verdict=(c,anim)=>{const ok=c===correct;$$('.icard',cards).forEach(b=>{const j=Number(b.dataset.c);b.disabled=true;if(j===correct)b.classList.add('right');else if(j===c)b.classList.add('wrong');else b.classList.add('dim')});cards.classList.add('done');$('#inotes').innerHTML=`<section class="notes"><h4>${ok?'Prof Honey’s notes · suspect identified':'Prof Honey’s notes · the stronger reading'}</h4><p><strong>${esc(p[1])}.</strong> ${esc(p[2])}</p></section>`;const cl=$(`[data-clue="${i}"]`);if(cl)cl.className='clue solved'+(ok?'':' miss');if(anim){sfx.stamp();Prof.react(ok,'debunk')}};
 $$('.icard',cards).forEach(b=>b.onclick=()=>{if(answers[key]!==undefined)return;const c=Number(b.dataset.c);record(key,c);award(key,c===correct);verdict(c,true)});
 if(prev!==undefined){$('#twI').textContent='What is the strongest concern about this passage?';cards.classList.add('instant');verdict(prev,false);Prof.say(prev===correct?'You already identified this suspect.':'You missed this suspect. My notes show the stronger reading.',prev===correct?'cracked':'falselead',false,'swap');return}
 cards.style.visibility='hidden';Prof.say("Interrogate the suspect. What's wrong with this passage?",'close',false,'swap');
 type($('#twI'),'What is the strongest concern about this passage?',20,my).then(()=>{if(my!==tok)return;cards.style.visibility='';cards.classList.add('show')})}
function detQ(t,i){const q=D.detReadings[t].questions[i],key='detective:'+t+':q'+i,a=answers[key];return `<div class="interro" data-q="${i}"><div class="qlabel">QUESTION ${i+1}</div><p style="font-weight:700;font-size:1.05rem;margin:.3em 0 .2em">${esc(q[0])}</p><div class="cards instant">${q[1].map((o,j)=>`<button class="icard ${a!==undefined?(j===q[2]?'right':j===a?'wrong':'dim'):''}" data-dq="${i}" data-c="${j}" ${a!==undefined?'disabled':''}><span class="lt">${String.fromCharCode(65+j)}</span><span class="txt">${esc(o)}</span></button>`).join('')}</div>${a!==undefined?`<section class="notes" style="animation:none"><h4>${a===q[2]?'Prof Honey’s notes · correct':'Prof Honey’s notes · review the evidence'}</h4><p>${esc(q[3])}</p></section>`:''}</div>`}
function bindDetQ(t){$$('[data-dq]',view).forEach(b=>b.onclick=()=>{const i=Number(b.dataset.dq),q=D.detReadings[t].questions[i],key='detective:'+t+':q'+i;if(answers[key]!==undefined)return;const c=Number(b.dataset.c);record(key,c);award(key,c===q[2]);sfx.stamp();Prof.react(c===q[2],'debunk');const wrap=b.closest('[data-q]');wrap.outerHTML=detQ(t,i);const nw=$(`[data-q="${i}"]`,view);bindDetQ(t);const n=$('.notes',nw);if(n)n.style.animation=''})}

/* ---------- videos ---------- */
function videos(d){view.innerHTML=bar(d,null)+`<article class="sheet"><div class="kicker">${esc(d.tab)}</div><h2>${esc(d.title)}</h2><p>${esc(d.intro)} Other files keep their own section scores. Show each score to your instructor.</p></article><div id="vlabHost" style="margin-top:22px"></div>`;
 bindBar(d);Prof.say(d.prof,'inspecting',true);
 const host=$('#vlabHost');let R;try{R=host.attachShadow({mode:'open'})}catch(e){host.innerHTML='<p class="sheet">This browser cannot show the video room. Please try an up-to-date Chrome, Edge, Firefox or Safari.</p>';return}
 R.innerHTML='<style>'+VLAB.css+'</style>'+VLAB.html;
 try{VLAB.init(R,()=>go('deck',{deck:'videos'}))}catch(e){console.error(e)}
 R.querySelectorAll('video').forEach(v=>v.addEventListener('error',()=>{if(v.nextElementSibling&&v.nextElementSibling.classList.contains('vl-missing'))return;const m=document.createElement('p');m.className='vl-missing';m.innerHTML='<strong>This video file could not be loaded.</strong> The videos only play from the full lesson package: the <em>videos</em> folder must sit next to index.html. If you are viewing a single preview file, upload or open the complete package instead.';v.insertAdjacentElement('afterend',m)}))}

/* ---------- handbook + locker ---------- */
const HB_ART={'Misinformation':'comment','Disinformation':'newspaper','Propaganda':'megaphone','Pseudoscience':'sparkle','Science denial':'brain','Cherry-picking':'cherries','Anecdote':'stars','Correlation ≠ causation':'chart','Hazard vs. risk':'petri','Appeal to nature':'mushroom','Conflict of interest':'money','Scientific consensus':'book','False balance':'scale','SIFT':'dossier'};
const HB_LENS='<svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="50" cy="50" r="33" fill="#fffdf3" stroke="#111" stroke-width="7"/><text x="50" y="64" text-anchor="middle" font-family="Courier New,monospace" font-weight="700" font-size="40" fill="#c0202b">?</text><path d="M34 33q9-10 22-10" stroke="#9a9a9a" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M74 74L105 105" stroke="#111" stroke-width="13" stroke-linecap="round"/><path d="M76 76L103 103" stroke="#c0202b" stroke-width="5" stroke-linecap="round"/></svg>';
let hbPage=0,hbEndSaid=false;
function hbPageHTML(p){const G=D.glossary,n=G.length;
 if(p===0)return `<div class="fb-page fb-cover" data-p="0"><div class="fb-cv-top">CASE FILE · FIELD REFERENCE</div><div class="fb-cv-title">THE DETECTIVE'S<br>HANDBOOK</div><div class="fb-cv-sub">${n} terms every investigator needs</div><div class="fb-cv-lens">${HB_LENS}</div><div class="fb-cv-prop">PROPERTY OF <b>PROF HONEY</b></div><span class="fb-cv-stamp">CONFIDENTIAL</span><div class="fb-cv-hint">TAP TO OPEN ▸</div></div>`;
 if(p>n)return `<div class="fb-page fb-cover fb-back" data-p="${p}"><div class="fb-cv-top">END OF HANDBOOK</div><div class="fb-cv-title">CASE<br>CLOSED</div><div class="fb-cv-sub">You've read every entry. Now put it to work.</div><div class="fb-cv-lens">${HB_LENS}</div><button class="btn red" data-hbgo="board">Open the case board →</button><span class="fb-cv-stamp">FILED</span><div class="fb-cv-hint">◂ BACK TO REVIEW ANY ENTRY</div></div>`;
 const [t,d]=G[p-1],art=HB_ART[t]||'dossier';
 return `<div class="fb-page" data-p="${p}"><div class="fb-hdr"><span>ENTRY ${String(p).padStart(2,'0')} / ${n}</span><span>FIELD HANDBOOK</span></div><div class="fb-body"><figure class="fb-sketch" aria-hidden="true"><i class="fb-tape"></i><svg viewBox="0 0 240 170">${ART[art]||''}</svg></figure><div class="fb-txt"><h3 class="fb-term">${esc(t)}</h3><p class="fb-def" aria-hidden="true" data-def="${esc(d)}">${esc(d)}</p><span class="sr">${esc(d)}</span></div></div><div class="fb-foot">p.${p}</div></div>`}
function hbSync(){const n=D.glossary.length,c=$('#fbCount');if(!c)return;
 c.textContent=hbPage===0?'COVER':hbPage>n?'BACK COVER':'ENTRY '+hbPage+' OF '+n;
 $('#fbPrev').disabled=hbPage===0;$('#fbNext').disabled=hbPage>n;$('#fbNext').textContent=hbPage===0?'Open →':'Next →';
 $$('.fb-tab').forEach(b=>{const on=+b.dataset.hbp===hbPage;b.classList.toggle('on',on);b.setAttribute('aria-current',on?'page':'false')})}
function hbFlip(to){const st=$('#fbStack');if(!st)return;const n=D.glossary.length;to=Math.max(0,Math.min(n+1,to));
 const cur=st.querySelector('.fb-page:not(.leaving)');if(cur&&to===hbPage)return;const dir=to>hbPage?1:-1;hbPage=to;skipping=false;const my=++tok;
 const tmp=document.createElement('div');tmp.innerHTML=hbPageHTML(to);const nw=tmp.firstElementChild;
 if(!cur||reduce){st.innerHTML='';st.appendChild(nw)}
 else if(dir>0){st.insertBefore(nw,cur);cur.classList.add('leaving','fb-up');setTimeout(()=>cur.remove(),650)}
 else{st.appendChild(nw);nw.classList.add('fb-down');cur.classList.add('leaving');setTimeout(()=>{cur.remove();nw.classList.remove('fb-down')},650)}
 if(cur)sfx.page();hbSync();
 const def=$('.fb-def',nw);if(def&&!reduce){const full=def.dataset.def;def.textContent='';setTimeout(()=>{if(my===tok)type(def,full,12,my)},cur?(dir>0?260:420):150)}
 const b=$('[data-hbgo]',nw);if(b)b.onclick=e=>{e.stopPropagation();go(b.dataset.hbgo)};
 if(to>n&&!hbEndSaid){hbEndSaid=true;Prof.say("That's the whole book. Now go crack some cases.",'thinking',false,'swap')}}
function handbook(){const G=D.glossary;if(hbPage>G.length+1)hbPage=0;
 view.innerHTML=`<article class="sheet hb"><div class="kicker">THE DETECTIVE'S HANDBOOK</div><h2>Know your terms</h2><p class="muted" style="margin-top:0">Flip through Prof Honey's notebook. Tap the page, swipe, or use the arrow keys.</p>
 <div class="fb"><div class="fb-pad" role="region" aria-label="Detective's handbook, flip notebook"><span class="fb-rings" aria-hidden="true"></span><div class="fb-stack" id="fbStack"></div></div>
 <div class="fb-nav"><button class="btn" id="fbPrev">← Back</button><span class="fb-count" id="fbCount" aria-live="polite"></span><button class="btn red" id="fbNext">Next →</button></div>
 <div class="fb-index" role="group" aria-label="Jump to a term"><span class="fb-index-lab">INDEX</span>${G.map(([a],i)=>`<button class="fb-tab" data-hbp="${i+1}">${esc(a)}</button>`).join('')}</div></div>
 <dl class="fb-print">${G.map(([a,b])=>`<dt>${esc(a)}</dt><dd>${esc(b)}</dd>`).join('')}</dl></article>
 <article class="sheet"><div class="kicker">FIELD GUIDE</div><h2>Ask five questions</h2><ol class="steps"><li><span>Who is making the claim?</span></li><li><span>What exactly is claimed?</span></li><li><span>What original evidence supports it?</span></li><li><span>What do independent sources find?</span></li><li><span>What are the consequences of acting on it?</span></li></ol>
 <p style="border:2px solid #000;background:#fff9ea;padding:10px 12px"><strong>Important:</strong> “I don’t know yet” is often the most scientifically responsible answer. Real uncertainty is not the same as proof of danger, and scientific consensus is not the same as infallibility.</p>
 <h3>Anthropology connections</h3><p><strong>Mary Douglas:</strong> Purity and pollution categories can shape food fears. <strong>Explanatory models:</strong> Existing beliefs influence what counts as a convincing account of illness. <strong>Political economy:</strong> Ask who gains financially or politically. <strong>Trust:</strong> Critique institutional failures without abandoning standards of evidence.</p>
 <button class="btn" onclick="window.print()">Print / save handbook as PDF</button></article>`;
 const st=$('#fbStack');let sx=null,sy=null,swiped=false;
 st.addEventListener('touchstart',e=>{const t=e.changedTouches[0];sx=t.clientX;sy=t.clientY;swiped=false},{passive:true});
 st.addEventListener('touchend',e=>{if(sx===null)return;const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;sx=null;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.3){swiped=true;hbFlip(hbPage+(dx<0?1:-1))}},{passive:true});
 st.onclick=()=>{if(swiped){swiped=false;return}if($('.fb-def.typing',st)){skipping=true;return}if(hbPage<=G.length)hbFlip(hbPage+1)};
 $('#fbPrev').onclick=()=>hbFlip(hbPage-1);$('#fbNext').onclick=()=>hbFlip(hbPage+1);
 $$('.fb-tab').forEach(b=>b.onclick=()=>hbFlip(+b.dataset.hbp));
 const keep=hbPage;hbPage=-1;hbFlip(keep);
 Prof.say("My handbook. Flip through it whenever you need a definition.",'inspecting')}
function locker(){view.innerHTML=`<article class="sheet"><div class="kicker">EVIDENCE LOCKER</div><h2>Original sources</h2><p>These are original public-health, regulatory, research-methods, and historical sources, linked so you can investigate directly. Live dashboards may change over time.</p>
 <div class="bags" style="margin-top:20px">${D.cases.map(c=>`<div class="bag"><h3>${esc(c.title)}</h3>${c.links.map(l=>`<a href="${esc(l[1])}" target="_blank" rel="noopener noreferrer">${esc(l[0])} ↗</a>`).join('')}</div>`).join('')}<div class="bag"><h3>More tools for checking claims</h3>${D.moreTools.map(l=>`<a href="${esc(l[1])}" target="_blank" rel="noopener noreferrer">${esc(l[0])} ↗</a>`).join('')}</div></div>
 <p class="muted" style="margin-top:20px">The original examples and links provide context, not endorsements of any fictional advertisement. Check live source pages before class, especially changing outbreak statistics and regulations.</p></article>`;
 Prof.say("Real sources. A good detective always checks the original.",'inspecting')}

/* ---------- global wiring ---------- */
$('#globalDefs').innerHTML=ART_DEFS+PROF.DEFS;
$('#logoBtn').onclick=()=>go('home');
$$('.tbtn[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
$('#soundBtn').onclick=()=>setSound(!sfx.on);(()=>{const sb=$('#soundBtn');sb.textContent='Sound: '+(sfx.on?'on':'off');sb.setAttribute('aria-pressed',sfx.on?'true':'false')})();
document.addEventListener('keydown',e=>{if(e.target&&/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
 const typingNow=!!$('.typing',view);
 if(typingNow&&(e.key==='Enter'||e.key===' ')&&!(e.target&&e.target.tagName==='BUTTON')){skipping=true;e.preventDefault();return}
 if(route.v==='handbook'&&(e.key==='ArrowRight'||e.key==='ArrowLeft')&&$('#fbStack')){e.preventDefault();hbFlip(hbPage+(e.key==='ArrowRight'?1:-1));return}
 if(route.v==='deck'&&typeof route.i==='number'){const cards=$('#cards');if(cards&&cards.style.visibility!=='hidden'&&!cards.classList.contains('done')){const k=e.key.toLowerCase();let idx='abcd'.indexOf(k);if(idx<0)idx='1234'.indexOf(k);if(idx>-1&&idx<$$('.icard',cards).length){e.preventDefault();choose(deckById(route.deck),route.i,idx);return}}
  if(e.key==='ArrowRight'){const n=$('#next');if(n&&!n.disabled)n.click()}}});
updatePts();
render();
})();
